<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Claude &lt;-&gt; Codex Bridge</title>
<style>
  :root{
    color-scheme: dark;
    --bg:#0f1115;
    --panel:#171a21;
    --panel-2:#1d222b;
    --panel-3:#10141a;
    --border:#303744;
    --border-soft:#252b35;
    --txt:#eef2f7;
    --muted:#9ca6b5;
    --soft:#c8d0dc;
    --claude:#b88cff;
    --claude-bg:#231a32;
    --codex:#68d391;
    --codex-bg:#16291f;
    --user:#72b7ff;
    --user-bg:#12263d;
    --system:#8c96a5;
    --system-bg:#14171d;
    --model:#ffd166;
    --danger:#ff6b6b;
    --shadow:0 18px 50px rgba(0,0,0,.32);
    --content-pad:max(16px, calc((100vw - 1720px)/2));
  }
  *{box-sizing:border-box}
  html,body{height:100%;width:100%;max-width:100%;overflow:hidden}
  @supports (height:100dvh){
    html,body{height:100dvh}
  }
  body{
    margin:0;
    font-family:"Segoe UI",system-ui,-apple-system,BlinkMacSystemFont,sans-serif;
    background:
      radial-gradient(circle at 20% 0%, rgba(184,140,255,.08), transparent 24rem),
      radial-gradient(circle at 95% 10%, rgba(104,211,145,.07), transparent 22rem),
      var(--bg);
    color:var(--txt);
    display:flex;
    flex-direction:column;
    overflow:hidden;
  }
  body > *{min-width:0}
  body.offline header{border-bottom-color:rgba(255,107,107,.55)}
  body.offline .mark{box-shadow:0 0 0 3px rgba(255,107,107,.12)}
  body.stale-heartbeat header{border-bottom-color:rgba(255,209,102,.42)}
  body.stale-heartbeat .mark{box-shadow:0 0 0 3px rgba(255,209,102,.1)}
  button,textarea{font:inherit}
  button{
    background:var(--panel-2);
    color:var(--txt);
    border:1px solid var(--border);
    border-radius:8px;
    padding:7px 11px;
    cursor:pointer;
    font-size:13px;
    line-height:1;
    transition:background .16s,border-color .16s,transform .16s,color .16s;
  }
  button:hover{background:#252b36;border-color:#465061}
  button:active{transform:translateY(1px)}
  button:disabled{opacity:.55;cursor:not-allowed;transform:none}
  button:focus-visible,a:focus-visible,textarea:focus-visible,input:focus-visible{
    outline:2px solid rgba(114,183,255,.78);
    outline-offset:2px;
  }
  button.icon{width:38px;height:34px;display:grid;place-items:center;padding:0}
  button.primary{background:var(--user);border-color:var(--user);color:#06182d;font-weight:700}
  button.primary:hover{background:#8ac4ff;border-color:#8ac4ff}
  header{
    width:100%;
    max-width:100%;
    min-height:62px;
    padding:10px 16px;
    background:rgba(23,26,33,.92);
    border-bottom:1px solid var(--border);
    display:grid;
    grid-template-columns:minmax(0,auto) minmax(220px,1fr) minmax(0,auto);
    gap:14px;
    align-items:center;
    backdrop-filter:blur(14px);
    box-shadow:0 1px 0 rgba(255,255,255,.03);
    z-index:3;
  }
  .brand{display:flex;align-items:center;gap:10px;min-width:0}
  .brand > div:last-child{min-width:0}
  .mark{
    width:34px;height:34px;border-radius:9px;
    display:grid;place-items:center;
    background:linear-gradient(135deg, rgba(184,140,255,.26), rgba(104,211,145,.22));
    border:1px solid rgba(255,255,255,.08);
    color:#fff;font-weight:800;
  }
  h1{font-size:15px;line-height:1.1;margin:0;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .subtitle{font-size:12px;color:var(--muted);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .centerbar{display:flex;align-items:center;gap:12px;min-width:0}
  .chips{display:flex;gap:8px;flex-wrap:wrap;align-items:center;min-width:0}
  .chip{
    min-height:28px;
    padding:5px 10px;
    border-radius:999px;
    background:#202631;
    border:1px solid var(--border);
    color:var(--muted);
    font-size:12px;
    display:inline-flex;
    align-items:center;
    gap:7px;
    white-space:nowrap;
  }
  .chip .dot{width:8px;height:8px;border-radius:50%;background:#647082;transition:background .2s,box-shadow .2s}
  .chip.on{color:var(--txt);border-color:currentColor;background:#232936}
  .chip.claude.on{color:var(--claude)}
  .chip.claude.on .dot{background:var(--claude);box-shadow:0 0 12px var(--claude);animation:pulse 1.25s infinite}
  .chip.codex.on{color:var(--codex)}
  .chip.codex.on .dot{background:var(--codex);box-shadow:0 0 12px var(--codex);animation:pulse 1.25s infinite}
  .chip.model{display:none}
  .chip.model.on{display:inline-flex;color:var(--model);background:#2b2618;border-color:rgba(255,209,102,.7)}
  .chip.model.on .dot{background:var(--model);box-shadow:0 0 12px var(--model);animation:pulse 1.25s infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.42}}
  .meta{
    min-width:0;
    display:flex;
    flex-direction:column;
    gap:2px;
    color:var(--muted);
    font-size:12px;
  }
  .meta-line{display:flex;gap:6px;align-items:center;min-width:0}
  .meta-line span{flex:none}
  .meta-line b{min-width:0}
  .meta b{color:var(--soft);font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .meta b.ok{color:var(--codex)}
  .meta b.warn{color:var(--model)}
  .meta b.bad{color:var(--danger)}
  .btns{min-width:0;max-width:100%;display:flex;gap:8px;align-items:center;justify-content:flex-end;flex-wrap:wrap}
  .btns button{white-space:nowrap}
  .btns button.on{border-color:var(--model);color:var(--model);background:#2b2618}
  #kill{background:#34191b;border-color:#7d3136;color:#ffd7da;font-weight:700}
  #kill:hover{background:#4a2024;border-color:var(--danger)}
  #exportMarkdown{font-size:10px;font-weight:800;letter-spacing:0}

  #searchPanel{
    width:100%;
    max-width:100%;
    display:none;
    align-items:center;
    gap:10px;
    padding:8px var(--content-pad);
    background:rgba(16,20,26,.96);
    border-bottom:1px solid var(--border);
    backdrop-filter:blur(14px);
    z-index:2;
  }
  #searchPanel.open{display:flex}
  .search-wrap{
    min-width:160px;
    flex:1;
    display:flex;
    align-items:center;
    gap:8px;
    padding:7px 10px;
    border:1px solid var(--border);
    border-radius:9px;
    background:#0b0f15;
  }
  .search-wrap span{color:var(--muted)}
  #searchInput{
    width:100%;
    min-width:0;
    border:0;
    outline:0;
    background:transparent;
    color:var(--txt);
    font:inherit;
    font-size:13px;
  }
  #searchInput::placeholder{color:#667184}
  #searchCount{
    min-width:86px;
    color:var(--muted);
    font-size:12px;
    text-align:center;
    white-space:nowrap;
  }
  .search-tools{display:flex;gap:7px;align-items:center}

  .filterbar{
    width:100%;
    max-width:100%;
    display:flex;
    align-items:center;
    gap:7px;
    padding:8px var(--content-pad);
    background:rgba(15,18,24,.92);
    border-bottom:1px solid var(--border-soft);
    overflow-x:auto;
    scrollbar-width:none;
    z-index:2;
  }
  .filterbar::-webkit-scrollbar{display:none}
  .filterbar .label{
    flex:none;
    color:var(--muted);
    font-size:12px;
  }
  .filter-btn{
    flex:none;
    min-height:28px;
    padding:5px 10px;
    border-radius:999px;
    background:#161c25;
    color:var(--muted);
    border-color:var(--border-soft);
    font-size:12px;
  }
  .filter-btn:hover{color:var(--txt);border-color:#465061}
  .filter-btn.on{
    color:#d9ecff;
    background:#12263d;
    border-color:rgba(114,183,255,.58);
  }
  .filter-btn .count{
    margin-left:4px;
    padding:1px 5px;
    border-radius:999px;
    background:rgba(255,255,255,.07);
    color:#9fb0c5;
    font-size:10px;
    font-variant-numeric:tabular-nums;
  }
  .filter-btn.on .count{background:rgba(114,183,255,.16);color:#d9ecff}
  .msg.filtered-out,.day-sep.filtered-out{display:none}

  .health-banner{
    width:100%;
    max-width:100%;
    display:none;
    align-items:center;
    gap:10px;
    padding:8px var(--content-pad);
    background:rgba(16,20,26,.96);
    border-bottom:1px solid var(--border-soft);
    color:var(--soft);
    font-size:12px;
    line-height:1.35;
    z-index:2;
  }
  .health-banner.show{display:flex}
  .health-banner .health-dot{
    flex:none;
    width:9px;
    height:9px;
    border-radius:50%;
    background:var(--model);
    box-shadow:0 0 12px rgba(255,209,102,.35);
  }
  .health-banner .health-title{
    flex:none;
    font-weight:800;
    color:var(--txt);
  }
  .health-banner .health-detail{
    min-width:0;
    flex:1;
    color:var(--muted);
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
  }
  .health-banner.warn{
    background:rgba(43,38,24,.96);
    border-bottom-color:rgba(255,209,102,.32);
  }
  .health-banner.bad{
    background:rgba(42,21,24,.96);
    border-bottom-color:rgba(255,107,107,.38);
  }
  .health-banner.bad .health-dot{
    background:var(--danger);
    box-shadow:0 0 12px rgba(255,107,107,.38);
  }
  .health-banner.bad .health-title{color:#ffd7da}
  body.has-health-banner #scrollProgress{top:174px}

  #log{
    position:relative;
    flex:1;
    overflow-y:auto;
    overflow-x:hidden;
    scrollbar-gutter:stable;
    width:100%;
    max-width:100%;
    min-width:0;
    padding:22px var(--content-pad) 24px;
    display:flex;
    flex-direction:column;
    gap:13px;
    scroll-behavior:smooth;
  }
  #log::-webkit-scrollbar{width:11px}
  #log::-webkit-scrollbar-track{background:transparent}
  #log::-webkit-scrollbar-thumb{background:#323946;border:3px solid var(--bg);border-radius:999px}
  #scrollProgress{
    position:fixed;
    top:136px;
    right:0;
    bottom:calc(70px + env(safe-area-inset-bottom,0px));
    z-index:4;
    width:3px;
    display:none;
    pointer-events:none;
    background:rgba(255,255,255,.035);
  }
  #scrollProgress span{
    display:block;
    width:100%;
    height:100%;
    transform:scaleY(0);
    transform-origin:top;
    background:linear-gradient(180deg, var(--user), var(--codex), var(--model));
    box-shadow:0 0 12px rgba(114,183,255,.32);
  }
  .msg{
    min-width:0;
    width:fit-content;
    max-width:min(860px,84%);
    display:grid;
    grid-template-columns:34px minmax(0,1fr);
    gap:10px;
    align-items:start;
    animation:rise .18s ease-out;
  }
  @keyframes rise{from{opacity:.6;transform:translateY(3px)}to{opacity:1;transform:none}}
  .avatar{
    width:34px;height:34px;border-radius:10px;
    display:grid;place-items:center;
    border:1px solid var(--border-soft);
    background:var(--panel-2);
    color:var(--txt);
    font-weight:800;
    font-size:13px;
    box-shadow:0 8px 24px rgba(0,0,0,.18);
  }
  .bubble{
    min-width:0;
    max-width:100%;
    position:relative;
    padding:10px 12px 9px;
    border:1px solid var(--border);
    border-radius:12px;
    background:var(--panel);
    --fade-bg:var(--panel);
    box-shadow:0 10px 30px rgba(0,0,0,.16);
  }
  .msg-head{
    display:flex;
    align-items:center;
    gap:8px;
    min-width:0;
    margin-bottom:6px;
  }
  .who{
    font-size:12px;
    line-height:1.2;
    font-weight:750;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
  }
  .time{
    color:var(--muted);
    font-size:11px;
    line-height:1.2;
    white-space:nowrap;
  }
  .seq{
    color:#657185;
    font-size:11px;
    line-height:1.2;
    font-variant-numeric:tabular-nums;
    white-space:nowrap;
  }
  .msg-actions{
    margin-left:auto;
    display:flex;
    opacity:0;
    pointer-events:none;
    transition:opacity .14s;
  }
  .msg:hover .msg-actions,.msg:focus-within .msg-actions{opacity:1;pointer-events:auto}
  .long-msg .msg-actions{opacity:1;pointer-events:auto}
  .msg.favorite .bubble{
    border-color:rgba(255,209,102,.56);
    box-shadow:0 0 0 1px rgba(255,209,102,.1),0 12px 34px rgba(0,0,0,.2);
  }
  .msg.favorite .bubble:before{
    content:"";
    position:absolute;
    top:-1px;
    left:14px;
    width:42px;
    height:2px;
    border-radius:999px;
    background:linear-gradient(90deg, rgba(255,209,102,.92), rgba(255,209,102,0));
  }
  .msg.search-hit .bubble{border-color:rgba(255,209,102,.58);box-shadow:0 0 0 1px rgba(255,209,102,.16),0 10px 30px rgba(0,0,0,.16)}
  .msg.search-current .bubble{border-color:var(--model);box-shadow:0 0 0 2px rgba(255,209,102,.28),0 16px 38px rgba(0,0,0,.24)}
  .msg:target .bubble,.msg.target-flash .bubble{border-color:rgba(114,183,255,.78);box-shadow:0 0 0 2px rgba(114,183,255,.22),0 16px 38px rgba(0,0,0,.24)}
  .mini-btn{
    height:24px;
    min-width:30px;
    padding:0 8px;
    border-radius:7px;
    background:#111720;
    border-color:#303846;
    color:var(--muted);
    font-size:11px;
  }
  .mini-btn:hover{color:var(--txt)}
  .mini-btn.favorite-msg{
    min-width:28px;
    padding:0 7px;
    color:#748196;
    font-size:14px;
  }
  .mini-btn.favorite-msg.on{
    color:var(--model);
    border-color:rgba(255,209,102,.52);
    background:rgba(255,209,102,.1);
  }
  .mini-btn.expand-msg{font-weight:800}
  .msg.expanded .mini-btn.expand-msg{color:var(--model);border-color:rgba(255,209,102,.48);background:rgba(255,209,102,.1)}
  .mini-btn.copied{color:var(--codex);border-color:rgba(104,211,145,.55);background:rgba(104,211,145,.1)}
  .mini-btn.bad{color:var(--danger);border-color:rgba(255,107,107,.56);background:rgba(255,107,107,.1)}
  .from-claude .avatar,.from-claude .bubble{border-color:rgba(184,140,255,.28)}
  .from-claude .avatar{background:var(--claude-bg);color:var(--claude)}
  .from-claude .bubble{background:linear-gradient(180deg, rgba(35,26,50,.92), rgba(25,25,34,.96));--fade-bg:#191922}
  .from-claude .who{color:var(--claude)}
  .from-codex .avatar,.from-codex .bubble{border-color:rgba(104,211,145,.26)}
  .from-codex .avatar{background:var(--codex-bg);color:var(--codex)}
  .from-codex .bubble{background:linear-gradient(180deg, rgba(22,41,31,.92), rgba(24,29,34,.96));--fade-bg:#181d22}
  .from-codex .who{color:var(--codex)}
  .from-user{
    align-self:flex-end;
    grid-template-columns:minmax(0,1fr) 34px;
    max-width:min(820px,84%);
  }
  .from-user .avatar{grid-column:2;grid-row:1;background:var(--user-bg);color:var(--user);border-color:rgba(114,183,255,.32)}
  .from-user .bubble{grid-column:1;grid-row:1;background:linear-gradient(180deg, rgba(18,38,61,.96), rgba(17,31,49,.98));border-color:rgba(114,183,255,.32);--fade-bg:#111f31}
  .from-user .who{color:var(--user)}
  .from-system{
    align-self:center;
    max-width:min(900px,92%);
    grid-template-columns:minmax(0,1fr);
    gap:0;
  }
  .from-system .avatar{
    display:none;
  }
  .from-system .bubble{
    padding:6px 10px;
    border-style:dashed;
    border-color:rgba(140,150,165,.24);
    background:rgba(20,23,29,.56);
    --fade-bg:#14171d;
    box-shadow:none;
    color:#b0bac8;
  }
  .from-system .msg-head{margin-bottom:3px}
  .from-system .msg-actions{display:none}
  .from-system .who{color:var(--system)}
  .from-system .md{font-size:12px}
  .from-system.system-collapsed:not(.search-hit){display:none}
  .system-bundle{
    align-self:center;
    width:min(900px,92%);
    display:flex;
    justify-content:center;
    margin:-6px 0 1px;
  }
  .system-bundle.filtered-out{display:none}
  .system-bundle button{
    min-height:26px;
    padding:4px 10px;
    border-radius:999px;
    border-style:dashed;
    color:#a8b3c3;
    background:rgba(20,23,29,.58);
    font-size:11px;
  }
  .system-bundle button:hover{color:#d8e0eb;border-color:#536072;background:#171d26}
  body.hide-system .from-system:not(.search-hit){display:none}
  body.compact-mode #log{gap:8px;padding:14px var(--content-pad) 18px}
  body.compact-mode .msg{
    grid-template-columns:26px minmax(0,1fr);
    gap:8px;
    max-width:min(940px,88%);
  }
  body.compact-mode .from-user{
    grid-template-columns:minmax(0,1fr) 26px;
    max-width:min(900px,88%);
  }
  body.compact-mode .avatar{width:26px;height:26px;border-radius:8px;font-size:11px}
  body.compact-mode .bubble{padding:7px 9px;border-radius:10px}
  body.compact-mode .msg-head{margin-bottom:3px}
  body.compact-mode .md{font-size:13px;line-height:1.45}
  body.compact-mode .from-system .bubble{padding:4px 8px}
  body.compact-mode .from-system .md{font-size:11.5px}
  .day-sep{
    align-self:center;
    width:min(760px,92%);
    display:flex;
    align-items:center;
    gap:10px;
    padding:4px 0;
    color:#788496;
    font-size:11px;
    font-weight:700;
    letter-spacing:0;
    text-transform:uppercase;
    margin:4px 0;
    background:linear-gradient(90deg, transparent, rgba(15,17,21,.88) 18%, rgba(15,17,21,.88) 82%, transparent);
  }
  .day-sep:before,.day-sep:after{
    content:"";
    height:1px;
    flex:1;
    background:linear-gradient(90deg, transparent, rgba(120,132,150,.42), transparent);
  }
  .unread-sep{
    align-self:center;
    width:min(680px,90%);
    display:flex;
    align-items:center;
    gap:10px;
    color:var(--model);
    font-size:11px;
    font-weight:800;
    margin:2px 0;
  }
  .unread-sep:before,.unread-sep:after{
    content:"";
    height:1px;
    flex:1;
    background:linear-gradient(90deg, transparent, rgba(255,209,102,.55), transparent);
  }
  .empty-state{
    align-self:center;
    width:min(620px,92%);
    display:none;
    margin:auto 0;
    padding:22px 18px;
    text-align:center;
    border:1px dashed rgba(120,132,150,.34);
    border-radius:14px;
    background:rgba(20,23,29,.42);
    color:var(--soft);
  }
  .empty-state.show{display:block}
  body.offline .empty-state.show{
    border-color:rgba(255,107,107,.36);
    background:rgba(52,25,27,.3);
  }
  .empty-state strong{
    display:block;
    margin-bottom:6px;
    color:#fff;
    font-size:14px;
  }
  body.offline .empty-state strong{color:#ffd7da}
  .empty-state span{
    display:block;
    color:var(--muted);
    font-size:12px;
    line-height:1.45;
  }

  .md{min-width:0;max-width:100%;font-size:14px;line-height:1.56;color:var(--txt);overflow-wrap:anywhere}
  .md p{margin:.45em 0}
  .md p:first-child{margin-top:0}
  .md p:last-child{margin-bottom:0}
  .bubble.long .md{
    max-height:420px;
    overflow:hidden;
    position:relative;
  }
  .bubble.long .md:after{
    content:"";
    position:absolute;
    left:0;
    right:0;
    bottom:0;
    height:58px;
    pointer-events:none;
    background:linear-gradient(180deg, rgba(0,0,0,0), var(--fade-bg));
  }
  .msg.expanded .bubble.long .md{max-height:none}
  .msg.expanded .bubble.long .md:after{display:none}
  .md h1,.md h2,.md h3,.md h4{margin:.65em 0 .35em;line-height:1.25;color:#fff}
  .md h1{font-size:1.28em}
  .md h2{font-size:1.18em}
  .md h3{font-size:1.08em}
  .md h4{font-size:1em}
  .md ul,.md ol{margin:.45em 0;padding-left:1.35em}
  .md li{margin:.22em 0}
  .md li.task{list-style:none;margin-left:-1.35em;display:flex;gap:8px;align-items:flex-start}
  .md li.task input{margin-top:.28em;accent-color:var(--codex)}
  .md blockquote{margin:.55em 0;padding:.1em .9em;border-left:3px solid var(--border);color:var(--soft)}
  .md .table-wrap{max-width:100%;overflow:auto;margin:.65em 0;border:1px solid var(--border);border-radius:10px;background:#0b0f15}
  .md table{width:100%;border-collapse:collapse;font-size:13px;min-width:420px}
  .md th,.md td{padding:8px 10px;border-bottom:1px solid var(--border-soft);vertical-align:top;text-align:left}
  .md th{background:#111720;color:#fff;font-weight:700;white-space:nowrap}
  .md tr:last-child td{border-bottom:0}
  .md tbody tr:hover{background:rgba(255,255,255,.025)}
  .md code{
    background:#0c1016;
    border:1px solid var(--border-soft);
    border-radius:5px;
    padding:1px 5px;
    font-family:Consolas,"Cascadia Mono","Courier New",monospace;
    font-size:.92em;
    color:#f4d78b;
  }
  .codebox{
    max-width:100%;
    min-width:0;
    margin:.65em 0;
    border:1px solid var(--border);
    border-radius:10px;
    overflow:hidden;
    background:#0b0f15;
  }
  .codebar{
    min-height:31px;
    padding:5px 7px 5px 10px;
    display:flex;
    align-items:center;
    gap:8px;
    flex-wrap:wrap;
    background:#111720;
    border-bottom:1px solid var(--border-soft);
    color:var(--muted);
    font-size:11px;
  }
  .codebar .lang{font-weight:700;text-transform:uppercase;letter-spacing:0}
  .code-tools{margin-left:auto;display:flex;gap:6px;align-items:center}
  .copy-code{margin-left:0}
  .mini-btn.wrap-code.on{color:var(--model);border-color:rgba(255,209,102,.52);background:rgba(255,209,102,.1)}
  .md pre{
    margin:0;
    padding:12px;
    overflow:auto;
    background:#0b0f15;
    max-height:56vh;
    max-width:100%;
  }
  .md pre code{
    display:block;
    min-width:100%;
    padding:0;
    border:0;
    background:transparent;
    color:#dfe7f3;
    font-size:13px;
    line-height:1.5;
    white-space:pre;
  }
  .codebox.wrap-code pre{overflow-x:hidden}
  .codebox.wrap-code pre code{white-space:pre-wrap;word-break:break-word}
  .tok.kw{color:#c792ea;font-weight:700}
  .tok.str{color:#c3e88d}
  .tok.com{color:#69758a;font-style:italic}
  .tok.num{color:#f78c6c}
  .tok.var{color:#82aaff}
  .tok.tag{color:#ffcb6b}
  .tok.attr{color:#89ddff}
  .md strong{color:#fff}
  .md a{color:#92c7ff;text-decoration:none;border-bottom:1px solid rgba(146,199,255,.34)}
  .md a:hover{border-bottom-color:#92c7ff}
  .attachments{min-width:0;max-width:100%;display:flex;flex-direction:column;gap:8px;margin-top:9px}
  .att-img-card{
    max-width:min(560px,100%);
    display:flex;
    flex-direction:column;
    gap:5px;
  }
  .att-img{
    display:block;
    max-width:100%;
    color:var(--muted);
    text-decoration:none;
  }
  .att-img img{
    display:block;
    width:auto;
    max-width:100%;
    max-height:390px;
    border-radius:10px;
    border:1px solid var(--border);
    background:#0b0f15;
    box-shadow:0 12px 34px rgba(0,0,0,.22);
  }
  .att-name{
    display:flex;
    gap:8px;
    align-items:center;
    margin-top:5px;
    font-size:12px;
    color:var(--muted);
    overflow:hidden;
    white-space:nowrap;
  }
  .att-name .name{min-width:0;overflow:hidden;text-overflow:ellipsis}
  .att-name .size{flex:none;color:#6f7b8d}
  .att-name .copy-att{flex:none;margin-left:auto}
  .att-file-row{
    width:max-content;
    max-width:100%;
    display:flex;
    align-items:center;
    gap:7px;
  }
  .att-file{
    display:flex;
    align-items:center;
    gap:9px;
    width:max-content;
    max-width:100%;
    padding:8px 10px;
    border:1px solid var(--border);
    border-radius:9px;
    background:#0d1219;
    color:var(--txt);
    text-decoration:none;
  }
  .att-file-row .att-file{min-width:0;flex:1}
  .att-file:hover{border-color:#4b5565;background:#111822}
  .att-file .paper{color:var(--muted)}
  .att-file span.name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .att-file small{color:var(--muted);white-space:nowrap}

  #working{
    width:fit-content;
    max-width:min(760px,86%);
    display:none;
    align-items:center;
    gap:10px;
    margin-top:2px;
    padding:10px 12px;
    border-radius:12px;
    background:rgba(23,26,33,.9);
    border:1px solid var(--border);
    box-shadow:0 10px 28px rgba(0,0,0,.16);
  }
  #working.claude{border-color:rgba(184,140,255,.36)}
  #working.codex{border-color:rgba(104,211,145,.32)}
  #working .work-dot{
    width:28px;height:28px;border-radius:9px;
    display:grid;place-items:center;
    background:#202631;
    color:var(--muted);
    font-weight:800;
    font-size:12px;
  }
  #working.claude .work-dot{background:var(--claude-bg);color:var(--claude)}
  #working.codex .work-dot{background:var(--codex-bg);color:var(--codex)}
  #working .lbl{font-size:13px;font-weight:650;color:var(--soft)}
  .typing{display:inline-flex;gap:4px}
  .typing i{width:6px;height:6px;border-radius:50%;background:var(--muted);animation:bounce 1.2s infinite}
  .typing i:nth-child(2){animation-delay:.2s}
  .typing i:nth-child(3){animation-delay:.4s}
  @keyframes bounce{0%,60%,100%{transform:translateY(0);opacity:.38}30%{transform:translateY(-5px);opacity:1}}
  .scroll-jump{
    position:fixed;
    right:18px;
    z-index:5;
    min-width:42px;
    height:42px;
    border-radius:999px;
    display:none;
    place-items:center;
    box-shadow:var(--shadow);
    background:#252c38;
  }
  .scroll-jump.show{display:grid}
  #toTop{bottom:calc(136px + env(safe-area-inset-bottom,0px))}
  #toBottom{bottom:calc(86px + env(safe-area-inset-bottom,0px))}
  #toBottom .new-count{
    position:absolute;
    top:-7px;
    right:-7px;
    min-width:20px;
    height:20px;
    padding:0 5px;
    border-radius:999px;
    display:none;
    place-items:center;
    background:var(--user);
    color:#06182d;
    border:1px solid rgba(255,255,255,.22);
    font-size:11px;
    font-weight:800;
    line-height:1;
  }
  #toBottom.has-new .new-count{display:grid}
  footer{
    width:100%;
    max-width:100%;
    min-width:0;
    padding:12px var(--content-pad) calc(12px + env(safe-area-inset-bottom,0px));
    background:rgba(23,26,33,.94);
    border-top:1px solid var(--border);
    display:flex;
    gap:10px;
    align-items:flex-end;
    backdrop-filter:blur(14px);
    z-index:4;
  }
  .compose-main{
    flex:1;
    min-width:0;
    display:flex;
    flex-direction:column;
    gap:5px;
  }
  #inp{
    width:100%;
    min-height:44px;
    max-height:170px;
    background:#0b0f15;
    color:var(--txt);
    border:1px solid var(--border);
    border-radius:10px;
    padding:11px 12px;
    font-size:14px;
    line-height:1.45;
    resize:none;
    outline:none;
  }
  #inp:focus{border-color:rgba(114,183,255,.72);box-shadow:0 0 0 3px rgba(114,183,255,.12)}
  .composer-status{
    min-height:16px;
    padding-left:2px;
    color:var(--muted);
    font-size:12px;
    line-height:1.25;
    display:none;
  }
  .composer-status.show{display:block}
  .composer-status.ok{color:var(--codex)}
  .composer-status.bad{color:var(--danger)}
  .upload-queue{
    display:none;
    gap:6px;
    flex-wrap:wrap;
    align-items:center;
    padding:1px 0;
  }
  .upload-queue.show{display:flex}
  .upload-pill{
    max-width:min(260px,100%);
    display:inline-flex;
    align-items:center;
    gap:7px;
    padding:5px 8px;
    border:1px solid var(--border-soft);
    border-radius:999px;
    background:#111822;
    color:var(--soft);
    font-size:12px;
    line-height:1.2;
  }
  .upload-pill .u-ico{flex:none;color:var(--muted)}
  .upload-pill .u-name{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .upload-pill .u-size{flex:none;color:#748196;font-size:11px}
  .upload-pill.active{border-color:rgba(114,183,255,.58);background:#12263d;color:#d9ecff}
  .upload-pill.done{border-color:rgba(104,211,145,.44);background:#12281e;color:#d9f8e4}
  .upload-pill.bad{border-color:rgba(255,107,107,.58);background:#32181c;color:#ffd7da}
  .composer-meta{
    min-height:15px;
    padding-left:2px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    color:#6f7b8d;
    font-size:11px;
    line-height:1.25;
  }
  .composer-meta span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .composer-meta .draft-state{flex:1}
  .composer-meta .char-count{flex:none}
  .composer-meta .char-count.warn{color:var(--model)}
  .composer-meta .char-count.bad{color:var(--danger)}
  .composer-clear{
    display:none;
    flex:none;
    height:20px;
    min-width:24px;
    padding:0 7px;
    border-radius:6px;
    font-size:12px;
    opacity:.78;
  }
  .composer-clear.show{display:inline-flex;align-items:center;justify-content:center}
  .composer-clear:hover{opacity:1}
  #attach{font-size:18px}
  #screen{font-size:16px}
  #voice{font-size:16px}
  #voice.listening{
    color:#ffd7da;
    background:#34191b;
    border-color:#7d3136;
  }
  #attach,#screen,#voice,#send{flex:none}
  #fileInput{display:none}
  body.dragover:after{
    content:"Отпустите файл, чтобы прикрепить";
    position:fixed;
    inset:12px;
    z-index:20;
    display:grid;
    place-items:center;
    border:2px dashed var(--user);
    border-radius:18px;
    background:rgba(7,10,15,.78);
    color:#d9ecff;
    font-weight:800;
    backdrop-filter:blur(5px);
  }
  #lightbox{
    position:fixed;
    inset:0;
    z-index:30;
    display:none;
    align-items:center;
    justify-content:center;
    padding:28px;
    background:rgba(0,0,0,.82);
  }
  #lightbox.open{display:flex}
  .lightbox-frame{max-width:96vw;max-height:94vh;display:flex;flex-direction:column;gap:8px;align-items:center}
  #lightbox img{max-width:96vw;max-height:86vh;border-radius:12px;border:1px solid var(--border);box-shadow:var(--shadow)}
  #lightbox button{position:absolute;top:18px;right:18px}
  .lightbox-caption{
    max-width:min(760px,96vw);
    display:flex;
    gap:12px;
    align-items:center;
    justify-content:center;
    color:var(--muted);
    font-size:12px;
  }
  .lightbox-caption span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .lightbox-caption a{flex:none;color:#92c7ff;text-decoration:none;border-bottom:1px solid rgba(146,199,255,.34)}
  .lightbox-caption a:hover{border-bottom-color:#92c7ff}

  @media (max-width:900px){
    header{grid-template-columns:1fr;gap:9px;align-items:start}
    .centerbar{flex-direction:column;align-items:stretch;gap:8px}
    .meta{gap:3px}
    .btns{justify-content:flex-start;flex-wrap:wrap}
  }
  @media (max-width:640px){
    body{background:var(--bg)}
    header{padding:10px 11px}
    .brand{gap:8px}
    .mark{width:31px;height:31px;border-radius:8px}
    h1{font-size:14px}
    .subtitle{display:none}
    .chips{gap:6px}
    .chip{padding:5px 8px;font-size:11px}
    .btns{
      width:100%;
      display:grid;
      grid-template-columns:repeat(3,minmax(0,1fr));
      justify-content:stretch;
      gap:7px;
    }
    .btns button{
      width:100%;
      min-width:0;
      padding-left:6px;
      padding-right:6px;
      overflow:hidden;
      text-overflow:ellipsis;
      white-space:nowrap;
      font-size:12px;
    }
    .btns button.icon{width:100%;height:34px}
    .filterbar{padding:7px 10px}
    .filterbar .label{display:none}
    .filter-btn{padding:5px 9px;font-size:11.5px}
    .health-banner{padding:8px 10px;align-items:flex-start}
    .health-banner .health-detail{white-space:normal}
    #searchPanel{padding:8px 10px;flex-wrap:wrap}
    .search-wrap{flex-basis:100%}
    #searchCount{text-align:left;min-width:auto}
    .search-tools{margin-left:auto}
    #log{padding:14px 10px 18px;gap:11px}
    #scrollProgress{top:178px;bottom:calc(74px + env(safe-area-inset-bottom,0px));width:2px}
    body.has-health-banner #scrollProgress{top:222px}
    .msg,.from-user{max-width:100%;grid-template-columns:30px minmax(0,1fr);gap:8px}
    .from-user{grid-template-columns:minmax(0,1fr) 30px}
    .avatar{width:30px;height:30px;border-radius:9px}
    .bubble{padding:9px 10px;border-radius:11px}
    .msg-actions{opacity:1;pointer-events:auto}
    .md{font-size:13.5px}
    body.compact-mode #log{padding:10px 8px 14px}
    body.compact-mode .msg,body.compact-mode .from-user{max-width:100%}
    footer{padding:10px 10px calc(10px + env(safe-area-inset-bottom,0px));gap:8px}
    .composer-meta{font-size:10.5px}
    #attach,#screen,#voice{width:38px}
    #send{padding:0 12px}
    #toTop,#toBottom{right:12px}
    #toTop{bottom:calc(126px + env(safe-area-inset-bottom,0px))}
    #toBottom{bottom:calc(78px + env(safe-area-inset-bottom,0px))}
  }
  @media (max-width:520px){
    footer{
      display:grid;
      grid-template-columns:42px 42px 42px minmax(0,1fr);
      align-items:end;
    }
    .compose-main{grid-column:1 / -1}
    #attach{grid-column:1;grid-row:2;width:42px}
    #screen{grid-column:2;grid-row:2;width:42px}
    #voice{grid-column:3;grid-row:2;width:42px}
    #send{grid-column:4;grid-row:2;width:100%;min-height:38px}
    .composer-meta{gap:6px}
  }
  @media (prefers-reduced-motion:reduce){
    *,#log{scroll-behavior:auto!important;animation:none!important;transition:none!important}
  }
</style>
</head>
<body>
<header>
  <div class="brand">
    <div class="mark">CC</div>
    <div>
      <h1>Claude &lt;-&gt; Codex</h1>
      <div class="subtitle">локальный мост агентов</div>
    </div>
  </div>
  <div class="centerbar">
    <div class="chips" aria-label="Активные агенты">
      <span id="chipClaude" class="chip claude"><span class="dot"></span><span class="lbl">Claude</span></span>
      <span id="chipCodex" class="chip codex"><span class="dot"></span><span class="lbl">Codex</span></span>
      <span id="chipModel" class="chip model"><span class="dot"></span><span class="lbl">модель</span></span>
    </div>
    <div class="meta">
      <div class="meta-line"><span>сейчас:</span><b id="st">ожидание</b></div>
      <div class="meta-line"><span>задача:</span><b id="task">нет активной задачи</b></div>
      <div class="meta-line"><span>активность:</span><b id="beat">обновляется</b></div>
      <div class="meta-line"><span>сеанс:</span><b id="sessionStats">загрузка</b></div>
    </div>
  </div>
  <div class="btns">
    <button id="searchToggle" class="icon" type="button" title="Поиск по истории (Ctrl+F)">⌕</button>
    <button id="exportChat" class="icon" type="button" title="Скачать историю JSON">⇩</button>
    <button id="exportMarkdown" class="icon" type="button" title="Скачать историю Markdown">MD</button>
    <button id="compactToggle" type="button" title="Переключить плотность ленты">Сжато</button>
    <button id="systemToggle" type="button" title="Показать или скрыть системные события">События</button>
    <button type="button" onclick="ctl('pause')" title="Пауза">⏸ Пауза</button>
    <button type="button" onclick="ctl('resume')" title="Продолжить">▶ Продолжить</button>
    <button id="restart" class="icon" type="button" onclick="restartBridge()" title="Перезапустить мост через supervisor">↻</button>
    <button id="kill" type="button" onclick="killSwitch()" title="Остановить текущую задачу">⛔ Стоп</button>
  </div>
</header>

<div id="filterBar" class="filterbar" aria-label="Фильтр ленты">
  <span class="label">показать:</span>
  <button class="filter-btn" type="button" data-filter="all" aria-pressed="true">Все <span class="count">0</span></button>
  <button class="filter-btn" type="button" data-filter="claude" aria-pressed="false">Claude <span class="count">0</span></button>
  <button class="filter-btn" type="button" data-filter="codex" aria-pressed="false">Codex <span class="count">0</span></button>
  <button class="filter-btn" type="button" data-filter="user" aria-pressed="false">Вы <span class="count">0</span></button>
  <button class="filter-btn" type="button" data-filter="files" aria-pressed="false">Файлы <span class="count">0</span></button>
  <button class="filter-btn" type="button" data-filter="code" aria-pressed="false">Код <span class="count">0</span></button>
</div>

<div id="healthBanner" class="health-banner" role="status" aria-live="polite">
  <span class="health-dot" aria-hidden="true"></span>
  <span id="healthTitle" class="health-title"></span>
  <span id="healthDetail" class="health-detail"></span>
  <button id="healthRetry" class="mini-btn" type="button" title="Проверить статус сейчас">↻</button>
</div>

<div id="searchPanel" aria-label="Поиск по истории">
  <label class="search-wrap">
    <span aria-hidden="true">⌕</span>
    <input id="searchInput" type="search" placeholder="Поиск по сообщениям, ролям и вложениям" autocomplete="off">
  </label>
  <span id="searchCount">поиск</span>
  <div class="search-tools">
    <button id="searchPrev" class="icon" type="button" title="Предыдущее совпадение">↑</button>
    <button id="searchNext" class="icon" type="button" title="Следующее совпадение">↓</button>
    <button id="searchClose" class="icon" type="button" title="Закрыть поиск">×</button>
  </div>
</div>

<main id="log" aria-live="polite">
  <div id="emptyState" class="empty-state" aria-live="polite">
    <strong>История загружается</strong>
    <span>Если сообщений нет, проверьте фильтр или строку поиска.</span>
  </div>
  <div id="working" class="">
    <span class="work-dot">...</span>
    <span class="lbl"></span>
    <span class="typing" aria-hidden="true"><i></i><i></i><i></i></span>
  </div>
</main>

<div id="scrollProgress" aria-hidden="true"><span></span></div>
<button id="toTop" class="scroll-jump" type="button" title="Прокрутить вверх"><span aria-hidden="true">↑</span></button>
<button id="toBottom" class="scroll-jump" type="button" title="Прокрутить вниз"><span aria-hidden="true">↓</span><span id="newCount" class="new-count"></span></button>

<footer>
  <button id="attach" class="icon" title="Прикрепить файл" type="button">📎</button>
  <button id="screen" class="icon" title="Сделать снимок экрана и отправить в ленту" type="button">▣</button>
  <button id="voice" class="icon" title="Голосовой ввод в черновик" type="button">🎙</button>
  <input id="fileInput" type="file" multiple>
  <div class="compose-main">
    <textarea id="inp" placeholder="Сообщение агентам. Enter — отправить, Shift+Enter — новая строка"></textarea>
    <div id="composerStatus" class="composer-status" role="status" aria-live="polite"></div>
    <div id="uploadQueue" class="upload-queue" aria-live="polite"></div>
    <div id="composerMeta" class="composer-meta" aria-live="polite">
      <span id="draftState" class="draft-state"></span>
      <button id="clearDraft" class="mini-btn composer-clear" type="button" title="Очистить черновик" aria-label="Очистить черновик">×</button>
      <span id="charCount" class="char-count"></span>
    </div>
  </div>
  <button id="send" class="primary" type="button" onclick="send()">Отправить</button>
</footer>

<div id="lightbox" aria-hidden="true">
  <button type="button" class="icon" title="Закрыть">×</button>
  <div class="lightbox-frame">
    <img alt="">
    <div class="lightbox-caption">
      <span id="lightboxName"></span>
      <a id="lightboxOpen" href="#" target="_blank" rel="noopener">Открыть оригинал</a>
    </div>
  </div>
</div>

<script>
let lastSeq = 0;
let firstLoad = true;
let stickToBottom = true;
let unseenCount = 0;
let searchMatches = [];
let searchIndex = -1;
let lastRenderedDay = '';
let unreadMarker = null;

function esc(s){
  return String(s ?? '')
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;')
    .replace(/'/g,'&#39;');
}
function escAttr(s){ return esc(s).replace(/\n/g,'&#10;'); }
function modelLabel(raw){
  if(!raw) return '';
  const key = String(raw).toLowerCase();
  return modelNames[key] || String(raw);
}
function fullTime(ts){
  const d = new Date(ts);
  if(Number.isNaN(d.getTime())) return '';
  return d.toLocaleString('ru-RU', {dateStyle:'short', timeStyle:'medium'});
}
function dayKey(ts){
  const d = new Date(ts);
  if(Number.isNaN(d.getTime())) return '';
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}
function dayLabel(ts){
  const d = new Date(ts);
  if(Number.isNaN(d.getTime())) return '';
  const today = new Date();
  const yesterday = new Date();
  yesterday.setDate(today.getDate() - 1);
  if(dayKey(ts) === dayKey(today)) return 'Сегодня';
  if(dayKey(ts) === dayKey(yesterday)) return 'Вчера';
  return d.toLocaleDateString('ru-RU', {day:'numeric', month:'long', weekday:'long'});
}
function relativeTime(ts){
  const d = new Date(ts);
  if(Number.isNaN(d.getTime())) return '';
  const diff = Math.max(0, Date.now() - d.getTime());
  const sec = Math.floor(diff / 1000);
  if(sec < 45) return 'только что';
  const min = Math.floor(sec / 60);
  if(min < 60) return min + ' мин назад';
  const hr = Math.floor(min / 60);
  if(hr < 24) return hr + ' ч назад';
  const day = Math.floor(hr / 24);
  if(day < 7) return day + ' д назад';
  return d.toLocaleDateString('ru-RU');
}
function fmtSize(n){
  n = Number(n) || 0;
  if(n >= 1024 * 1024) return (n / (1024 * 1024)).toFixed(1) + ' MB';
  if(n >= 1024) return (n / 1024).toFixed(1) + ' KB';
  return n + ' B';
}
function pluralRu(n, one, few, many){
  n = Math.abs(Number(n) || 0);
  const mod10 = n % 10;
  const mod100 = n % 100;
  if(mod10 === 1 && mod100 !== 11) return one;
  if(mod10 >= 2 && mod10 <= 4 && (mod100 < 12 || mod100 > 14)) return few;
  return many;
}
function loadFavoriteSeqs(){

    return new Set(raw.map(v => String(v)).filter(v => /^\d+$/.test(v)));
  }catch(e){
    return new Set();
  }
}

function isNearBottom(){
  return log.scrollHeight - log.scrollTop - log.clientHeight < 120;
}
function updateScrollProgress(){
  if(!scrollProgress || !scrollProgressFill) return;
  const maxScroll = Math.max(0, log.scrollHeight - log.clientHeight);
  if(maxScroll < 80){
    scrollProgress.style.display = 'none';
    scrollProgressFill.style.transform = 'scaleY(0)';
    return;
  }
  const progress = Math.max(0, Math.min(1, log.scrollTop / maxScroll));
  scrollProgress.style.display = 'block';
  scrollProgressFill.style.transform = 'scaleY(' + progress.toFixed(4) + ')';
}

function rebuildSystemGroups(){
  document.querySelectorAll('.system-bundle').forEach(n => n.remove());
  document.querySelectorAll('.from-system').forEach(msg => {
    msg.classList.remove('system-collapsed');
    delete msg.dataset.systemGroup;
  });

  let group = [];
  const flushGroup = () => {
    if(group.length < 3){
      group = [];
      return;
    }
    const first = group[0];
    const groupId = 'sys-' + (first.dataset.seq || String(first.dataset.rawText || '').length + '-' + group.length);
    const expanded = systemGroupsExpanded.has(groupId);
    const label = group.length + ' ' + pluralRu(group.length, 'системное событие', 'системных события', 'системных событий');
    group.forEach(msg => { msg.dataset.systemGroup = groupId; });
    group.forEach(msg => msg.classList.toggle('system-collapsed', !expanded));

    const bundle = document.createElement('div');
    bundle.className = 'system-bundle' + (!showSystem || activeFilter !== 'all' ? ' filtered-out' : '');
    bundle.dataset.systemGroup = groupId;
    bundle.innerHTML =
      '<button type="button" title="' + (expanded ? 'Свернуть системные события' : 'Показать системные события') + '">' +
        (expanded ? 'Свернуть ' : '+ ') + label +
      '</button>';
    first.before(bundle);
    group = [];
  };

  [...log.children].forEach(child => {
    if(child === working || child.classList.contains('day-sep') || child.classList.contains('unread-sep')){
      flushGroup();
    } else if(child.classList.contains('msg') && child.classList.contains('from-system')){
      group.push(child);
    } else if(child.classList.contains('msg')){
      flushGroup();
    }
  });
  flushGroup();
}

  if(activeFilter === 'all') return true;
  if(activeFilter === 'files') return msg.dataset.hasAttachments === '1';
  if(activeFilter === 'code') return msg.dataset.hasCode === '1';
  if(activeFilter === 'favorites') return msg.dataset.favorite === '1';
  return msg.dataset.role === activeFilter;
}

  document.querySelectorAll('.msg').forEach(msg => {
    if(!showSystem && msg.classList.contains('from-system')) return;
    const role = msg.dataset.role;
    counts.all++;
    if(counts[role] !== undefined) counts[role]++;
    if(msg.dataset.hasAttachments === '1') counts.files++;
    if(msg.dataset.hasCode === '1') counts.code++;
    if(msg.dataset.favorite === '1') counts.favorites++;
  });
  filterButtons.forEach(btn => {
    const count = btn.querySelector('.count');
    if(count) count.textContent = String(counts[btn.dataset.filter] || 0);
  });

function heartbeatInfo(ts){
  const d = new Date(ts);
  if(Number.isNaN(d.getTime())) return {label:'нет данных', level:'bad', title:''};
  const diff = Math.max(0, Date.now() - d.getTime());
  const sec = Math.floor(diff / 1000);
  if(sec < 45) return {label:'сейчас', level:'ok', title:fullTime(ts)};
  const min = Math.floor(sec / 60);
  if(min < 2) return {label:sec + ' сек назад', level:'warn', title:fullTime(ts)};
  if(min < 60) return {label:min + ' мин назад', level:min >= 5 ? 'bad' : 'warn', title:fullTime(ts)};
  const hr = Math.floor(min / 60);
  return {label:hr + ' ч назад', level:'bad', title:fullTime(ts)};
}
function elapsedShort(ts){
  const d = new Date(ts);
  if(Number.isNaN(d.getTime())) return '';
  const diff = Math.max(0, Date.now() - d.getTime());
  const sec = Math.floor(diff / 1000);
  if(sec < 60) return sec + ' сек';
  const min = Math.floor(sec / 60);
  if(min < 60) return min + ' мин';
  const hr = Math.floor(min / 60);
  if(hr < 24) return hr + ' ч';
  return Math.floor(hr / 24) + ' д';
}
function activityInfo(s){
  if(s.active_agent && s.claimed_at){
    const started = new Date(s.claimed_at);
    const ageMs = Number.isNaN(started.getTime()) ? 0 : Math.max(0, Date.now() - started.getTime());
    const who = s.active_agent === 'claude' ? 'Claude' : 'Codex';
    let level = 'ok';
    if(ageMs > 90 * 60 * 1000) level = 'bad';
    else if(ageMs > 30 * 60 * 1000) level = 'warn';
    return {
      label:who + ' ' + elapsedShort(s.claimed_at),
      level,
      title:'Ход начат: ' + fullTime(s.claimed_at) + (s.heartbeat ? ' · heartbeat: ' + fullTime(s.heartbeat) : '')
    };
  }
  return heartbeatInfo(s.heartbeat || s.driver_started);
}

function syntaxTokenKey(n){
  let out = '';
  do {
    out = String.fromCharCode(65 + (n % 26)) + out;
    n = Math.floor(n / 26) - 1;
  } while(n >= 0);
  return out;
}
function highlightCode(raw, lang){
  const l = String(lang || '').toLowerCase();
  let html = esc(raw);
  const saved = [];
  const save = (txt, cls) => {
    const token = '\uE000' + syntaxTokenKey(saved.length) + '\uE001';
    saved.push({token, html:'<span class="tok ' + cls + '">' + txt + '</span>'});
    return token;
  };
  const stash = (re, cls) => { html = html.replace(re, m => save(m, cls)); };

  if(l.includes('html') || l.includes('xml')){
    stash(/&lt;!--[\s\S]*?--&gt;/g, 'com');
  }
  stash(/(&quot;(?:\\.|(?!&quot;)[\s\S])*?&quot;|&#39;(?:\\.|(?!&#39;)[\s\S])*?&#39;)/g, 'str');

  if(l.includes('ps') || l.includes('powershell')){
    html = html.replace(/(^|[\s;(])(#.*)$/gm, (m, lead, body) => lead + save(body, 'com'));
    html = html.replace(/\$[A-Za-z_][\w:]*/g, m => '<span class="tok var">' + m + '</span>');
    html = html.replace(/\b(function|param|process|begin|end|if|elseif|else|foreach|for|while|switch|try|catch|finally|return|throw|break|continue|true|false|null)\b/gi, '<span class="tok kw">$1</span>');
  } else if(l.includes('js') || l.includes('ts') || l.includes('json') || l.includes('css')){
    stash(/\/\*[\s\S]*?\*\//g, 'com');
    html = html.replace(/(^|[\s;{}])((?:\/\/).*)$/gm, (m, lead, body) => lead + save(body, 'com'));
    html = html.replace(/\b(async|await|const|let|var|function|return|if|else|for|while|switch|case|break|continue|try|catch|finally|class|new|import|export|from|true|false|null|undefined)\b/g, '<span class="tok kw">$1</span>');
  } else if(l.includes('html') || l.includes('xml')){
    html = html.replace(/(&lt;\/?)([A-Za-z][\w:-]*)/g, '$1<span class="tok tag">$2</span>');
    html = html.replace(/\s([A-Za-z_:][-A-Za-z0-9_:.]*)(=)/g, ' <span class="tok attr">$1</span>$2');
  }

  html = html.replace(/\b(-?\d+(?:\.\d+)?)\b/g, '<span class="tok num">$1</span>');
  for(const item of saved){
    html = html.split(item.token).join(item.html);
  }
  return html;
}

function renderMd(src){
  src = String(src || '').replace(/\r\n/g,'\n');
  const blocks = [];
  src = src.replace(/```([^\n`]*)\n?([\s\S]*?)```/g, (m, lang, code) => {
    const cleanLang = String(lang || '').trim().split(/\s+/)[0] || 'text';
    const token = '@@CODE_BLOCK_' + blocks.length + '@@';
    blocks.push({token, lang:cleanLang, code:code.replace(/\n$/,'')});
    return '\n' + token + '\n';
  });

  let safe = esc(src);
  safe = safe.replace(/`([^`\n]+)`/g, '<code>$1</code>');
  safe = safe.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
  safe = safe.replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>');
  safe = safe.replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+|\/files\/[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');

  const lines = safe.split('\n');
  const out = [];
  let inList = false;
  let listType = '';
  const isTableSep = line => /^\|?\s*:?-{3,}:?\s*(\|\s*:?-{3,}:?\s*)+\|?$/.test(line.trim());
  const tableCells = line => {
    let s = line.trim();
    if(s.startsWith('|')) s = s.slice(1);
    if(s.endsWith('|')) s = s.slice(0, -1);
    return s.split('|').map(c => c.trim());
  };
  const renderListItem = body => {
    const task = body.match(/^\[(x|X| )\]\s+(.*)$/);
    if(task){
      const checked = task[1].toLowerCase() === 'x' ? ' checked' : '';
      return '<li class="task"><input type="checkbox" disabled' + checked + '><span>' + task[2] + '</span></li>';
    }
    return '<li>' + body + '</li>';
  };
  const renderTable = (headers, rows) => {
    const head = '<thead><tr>' + headers.map(h => '<th>' + h + '</th>').join('') + '</tr></thead>';
    const body = '<tbody>' + rows.map(row => {
      const cells = headers.map((_, i) => '<td>' + (row[i] || '') + '</td>').join('');
      return '<tr>' + cells + '</tr>';
    }).join('') + '</tbody>';
    return '<div class="table-wrap"><table>' + head + body + '</table></div>';
  };
  const closeList = () => {
    if(inList){
      out.push('</' + listType + '>');
      inList = false;
      listType = '';
    }
  };

  for(let i = 0; i < lines.length; i++){
    const line = lines[i];
    const trimmed = line.trim();
    if(/^@@CODE_BLOCK_\d+@@$/.test(trimmed)){
      closeList();
      out.push(trimmed);
      continue;
    }
    const h = line.match(/^(#{1,4})\s+(.*)$/);
    const ul = line.match(/^\s*[-*]\s+(.*)$/);
    const ol = line.match(/^\s*\d+\.\s+(.*)$/);
    const quote = line.match(/^\s*&gt;\s?(.*)$/);
    if(trimmed.includes('|') && i + 1 < lines.length && isTableSep(lines[i + 1])){
      closeList();
      const headers = tableCells(line);
      const rows = [];
      i += 2;
      while(i < lines.length && lines[i].trim() && lines[i].includes('|') && !/^@@CODE_BLOCK_\d+@@$/.test(lines[i].trim())){
        rows.push(tableCells(lines[i]));
        i++;
      }
      i--;
      out.push(renderTable(headers, rows));
    } else if(h){
      closeList();
      out.push('<h' + h[1].length + '>' + h[2] + '</h' + h[1].length + '>');
    } else if(ul){
      if(!inList || listType !== 'ul'){ closeList(); inList = true; listType = 'ul'; out.push('<ul>'); }
      out.push(renderListItem(ul[1]));
    } else if(ol){
      if(!inList || listType !== 'ol'){ closeList(); inList = true; listType = 'ol'; out.push('<ol>'); }
      out.push(renderListItem(ol[1]));
    } else if(quote){
      closeList();
      out.push('<blockquote>' + quote[1] + '</blockquote>');
    } else {
      closeList();
      if(trimmed) out.push('<p>' + line + '</p>');
    }
  }
  closeList();

  let html = out.join('\n');
  for(const block of blocks){
    const codeHtml =
      '<div class="codebox">' +
        '<div class="codebar"><span class="lang">' + esc(block.lang) + '</span><span class="code-tools"><button type="button" class="mini-btn wrap-code" title="Переносить длинные строки" aria-label="Переносить длинные строки" aria-pressed="false">↔</button><button type="button" class="mini-btn copy-code" title="Скопировать код" aria-label="Скопировать код">&#x2398;</button></span></div>' +
        '<pre><code>' + highlightCode(block.code, block.lang) + '</code></pre>' +
      '</div>';
    html = html.replace(block.token, codeHtml);
  }
  return html;
}

async function poll(){

    noteConnectionOk();

async function requestOk(url, options, timeoutMs){
  const opts = options ? Object.assign({}, options) : {};
  if(!Object.prototype.hasOwnProperty.call(opts, 'credentials')) opts.credentials = 'same-origin';
  if(!Object.prototype.hasOwnProperty.call(opts, 'cache')) opts.cache = 'no-store';
  let timer = null;
  let ctrl = null;
  if(typeof AbortController !== 'undefined' && !opts.signal){
    ctrl = new AbortController();
    opts.signal = ctrl.signal;
    timer = setTimeout(() => ctrl.abort(), timeoutMs || 12000);
  }
  try{
    const r = await fetch(url, opts);
    if(!r.ok) throw new Error('HTTP ' + r.status + ' ' + (r.statusText || ''));
    return r;
  }catch(e){
    if(e && e.name === 'AbortError') throw new Error('timeout');
    throw e;
  }finally{
    if(timer) clearTimeout(timer);
  }
}
async function fetchJson(url, options){
  const r = await requestOk(url, options);
  return await r.json();
}

    const okText = 'Markdown экспортирован: ' + data.length + ' ' + pluralRu(data.length, 'сообщение', 'сообщения', 'сообщений');
    setComposerStatus(okText, 'ok');
    clearComposerStatusSoon(okText);
  }catch(e){
    setComposerStatus('Markdown не экспортирован: ' + (e.message || e), 'bad');
  }finally{
    exportMarkdownBtn.disabled = false;
  }
}
function updateSendState(){
  sendBtn.disabled = sending || uploading || screenshotting || !input.value.trim();
  sendBtn.textContent = uploading ? 'Загрузка...' : (sending ? 'Отправка...' : 'Отправить');
  attachBtn.disabled = sending || uploading || screenshotting;
  screenBtn.disabled = sending || uploading || screenshotting;
  voiceBtn.disabled = !speechSupported() || (!voiceListening && (sending || uploading || screenshotting));
  attachBtn.setAttribute('aria-busy', uploading ? 'true' : 'false');
  screenBtn.setAttribute('aria-busy', screenshotting ? 'true' : 'false');
  voiceBtn.setAttribute('aria-busy', voiceListening ? 'true' : 'false');
}
async function copyText(text, btn){
  try{
    if(navigator.clipboard && window.isSecureContext){
      await navigator.clipboard.writeText(text);
    } else {
      const t = document.createElement('textarea');
      t.value = text;
      t.style.position = 'fixed';
      t.style.left = '-9999px';
      document.body.appendChild(t);
      t.focus();
      t.select();
      document.execCommand('copy');
      t.remove();
    }
    if(btn){
      const old = btn.innerHTML;
      const oldLabel = btn.getAttribute('aria-label');
      btn.classList.remove('bad');
      btn.classList.add('copied');
      btn.innerHTML = '&check;';
      btn.setAttribute('aria-label','Скопировано');
      setTimeout(() => {
        btn.innerHTML = old;
        btn.classList.remove('copied');
        if(oldLabel) btn.setAttribute('aria-label', oldLabel);
      }, 900);
    }
  }catch(e){
    if(btn){
      const old = btn.innerHTML;
      const oldLabel = btn.getAttribute('aria-label');
      btn.classList.remove('copied');
      btn.classList.add('bad');
      btn.innerHTML = '!';
      btn.setAttribute('aria-label','Не скопировано');
      setTimeout(() => {
        btn.innerHTML = old;
        btn.classList.remove('bad');
        if(oldLabel) btn.setAttribute('aria-label', oldLabel);
      }, 1200);
    }
  }
}
async function send(){
  if(voiceListening && speechRec) speechRec.stop();
  const text = input.value.trim();
  if(!text || sending || uploading || screenshotting) return;
  const draft = input.value;
  sending = true;
  input.value = '';
  localStorage.removeItem('bridgeDraft');
  resizeInput();
  updateComposerMeta();
  updateSendState();
  setComposerStatus('Отправка...');
  try{
    await requestOk('/api/say', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({text})});
    setComposerStatus('Отправлено', 'ok');
    clearComposerStatusSoon('Отправлено');
    poll();
  }catch(e){
    input.value = draft;
    localStorage.setItem('bridgeDraft', draft);
    resizeInput();
    updateComposerMeta();
    setComposerStatus('Не отправлено: ' + (e.message || e), 'bad');
  }finally{
    sending = false;
    updateSendState();
  }
}
async function takeScreenshot(){
  if(voiceListening && speechRec) speechRec.stop();
  if(sending || uploading || screenshotting) return;
  screenshotting = true;
  const caption = input.value.trim();
  const draft = input.value;
  updateSendState();
  setComposerStatus('Делаю снимок экрана...');
  try{
    const payload = {text:caption};
    const data = await fetchJson('/api/screenshot', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify(payload)
    });
    if(caption){
      input.value = '';
      localStorage.removeItem('bridgeDraft');
      resizeInput();
      updateComposerMeta();
    }
    const okText = data && data.attachment ? 'Снимок экрана добавлен в ленту' : 'Снимок экрана сделан';
    setComposerStatus(okText, 'ok');
    clearComposerStatusSoon(okText);
    poll();
  }catch(e){
    input.value = draft;
    if(draft) localStorage.setItem('bridgeDraft', draft);
    resizeInput();
    updateComposerMeta();
    setComposerStatus('Снимок не удался: ' + (e.message || e), 'bad');
  }finally{
    screenshotting = false;
    updateSendState();
  }
}
function speechSupported(){
  return Boolean(window.SpeechRecognition || window.webkitSpeechRecognition);
}
function persistInput(){
  localStorage.setItem('bridgeDraft', input.value);
  resizeInput();
  updateComposerMeta();
  updateSendState();
}
function clearDraft(){
  if(voiceListening && speechRec) speechRec.stop();
  input.value = '';
  localStorage.removeItem('bridgeDraft');
  resizeInput();
  updateComposerMeta();
  updateSendState();
  input.focus();
  setComposerStatus('Черновик очищен', 'ok');
  clearComposerStatusSoon('Черновик очищен');
}
function appendToComposer(snippet){
  const current = input.value.trimEnd();
  input.value = current ? current + '\n\n' + snippet : snippet;
  persistInput();
  input.focus();
  input.setSelectionRange(input.value.length, input.value.length);
}
function quoteMessage(msg){
  if(!msg) return;
  const raw = String(msg.dataset.rawText || '').trim();
  if(!raw) return;
  const roleKey = msg.dataset.role || '';
  const role = (roleInfo[roleKey] && roleInfo[roleKey].name) || roleKey || 'сообщение';
  const seq = msg.dataset.seq ? ' #' + msg.dataset.seq : '';
  const allLines = raw.split(/\r\n|\r|\n/);
  const snippet = raw.length > 1600 ? raw.slice(0, 1600).trimEnd() : raw;
  const lines = snippet.split(/\r\n|\r|\n/).slice(0, 14);
  let quoted = '> ' + role + seq + '\n' + lines.map(line => '> ' + line).join('\n');
  if(allLines.length > lines.length || raw.length > snippet.length){
    quoted += '\n> ...';
  }
  appendToComposer(quoted + '\n\n');
  setComposerStatus('Цитата добавлена в черновик', 'ok');
  clearComposerStatusSoon('Цитата добавлена в черновик');
}
function setVoiceState(on){
  voiceListening = Boolean(on);
  voiceBtn.classList.toggle('listening', voiceListening);
  voiceBtn.textContent = voiceListening ? '■' : '🎙';
  voiceBtn.title = voiceListening ? 'Остановить голосовой ввод' : 'Голосовой ввод в черновик';
  updateSendState();
}
function ensureSpeech(){
  if(speechRec) return speechRec;
  const SpeechCtor = window.SpeechRecognition || window.webkitSpeechRecognition;
  if(!SpeechCtor){
    voiceBtn.disabled = true;
    voiceBtn.title = 'Голосовой ввод не поддерживается этим браузером';
    setComposerStatus('Голосовой ввод не поддерживается этим браузером', 'bad');
    return null;
  }
  speechRec = new SpeechCtor();
  speechRec.lang = 'ru-RU';
  speechRec.continuous = true;
  speechRec.interimResults = true;
  speechRec.maxAlternatives = 1;
  speechRec.onstart = () => {
    setVoiceState(true);
    setComposerStatus('Слушаю...');
  };
  speechRec.onend = () => {
    setVoiceState(false);
    if(composerStatus.textContent === 'Слушаю...') setComposerStatus('');
  };
  speechRec.onerror = e => {
    setVoiceState(false);
    setComposerStatus('Голосовой ввод: ' + (e.error || 'ошибка распознавания'), 'bad');
  };
  speechRec.onresult = e => {
    let finalText = '';
    let interimText = '';
    for(let i = e.resultIndex; i < e.results.length; i++){
      const phrase = e.results[i][0] && e.results[i][0].transcript ? e.results[i][0].transcript.trim() : '';
      if(!phrase) continue;
      if(e.results[i].isFinal) finalText += phrase + ' ';
      else interimText += phrase + ' ';
    }
    if(finalText){
      voiceFinalText = (voiceFinalText + ' ' + finalText).trim();
      input.value = [voiceBaseText, voiceFinalText].filter(Boolean).join(voiceBaseText && voiceFinalText ? ' ' : '');
      persistInput();
    }
    if(interimText) setComposerStatus('Слышу: ' + interimText.trim());
    else if(voiceListening) setComposerStatus('Слушаю...');
  };
  return speechRec;
}
function toggleVoice(){
  const rec = ensureSpeech();
  if(!rec) return;
  if(voiceListening){
    rec.stop();
    return;
  }
  voiceBaseText = input.value.trim();
  voiceFinalText = '';
  try{
    rec.start();
  }catch(e){
    setVoiceState(false);
    setComposerStatus('Голосовой ввод уже запущен или недоступен', 'bad');
  }
}
async function ctl(action){
  try{
    await requestOk('/api/control', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({action})});
    status();
  }catch(e){
    showConnectionProblem('control', e);
  }
}
async function killSwitch(){
  if(!confirm('Стоп-кран: прервать текущую задачу и остановить процесс агента?')) return;
  await ctl('kill');
}
async function restartBridge(){
  if(!confirm('Перезапустить мост через supervisor? Текущая задача будет возобновлена после рестарта.')) return;
  await ctl('restart');
}
function readDataUrl(file){
  return new Promise((resolve,reject) => {
    const fr = new FileReader();
    fr.onload = () => resolve(fr.result);
    fr.onerror = () => reject(fr.error);
    fr.readAsDataURL(file);
  });
}
async function uploadFiles(files){
  files = [...files].filter(Boolean);
  if(!files.length || uploading) return;
  const tooBig = files.find(f => Number(f.size) > 25 * 1024 * 1024);
  if(tooBig){
    renderUploadQueue(files, -1, files.indexOf(tooBig));
    setComposerStatus('Файл больше 25 MB: ' + uploadName(tooBig), 'bad');
    return;
  }
  uploading = true;
  const caption = input.value.trim();
  const draft = input.value;
  let uploaded = 0;
  if(caption){
    input.value = '';
    localStorage.removeItem('bridgeDraft');
    resizeInput();
    updateComposerMeta();
  }
  updateSendState();
  renderUploadQueue(files, 0, -1);
  try{
    for(let i = 0; i < files.length; i++){
      const file = files[i];
      renderUploadQueue(files, i, -1);
      setComposerStatus('Загрузка ' + (i + 1) + '/' + files.length + ': ' + uploadName(file));
      const dataB64 = await readDataUrl(file);
      const text = i === 0 ? caption : '';
      await requestOk('/api/upload', {
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body:JSON.stringify({name:uploadName(file), mime:file.type || '', dataB64, text})
      });
      uploaded++;
      renderUploadQueue(files, i + 1, -1);
    }
    const okText = files.length === 1 ? 'Файл прикреплён' : 'Файлы прикреплены: ' + files.length;
    setComposerStatus(okText, 'ok');
    clearComposerStatusSoon(okText);
    clearUploadQueueSoon();
    poll();
  }catch(e){
    renderUploadQueue(files, uploaded, uploaded);
    if(caption && uploaded === 0){
      input.value = draft;
      localStorage.setItem('bridgeDraft', draft);
      resizeInput();
      updateComposerMeta();
    }
    setComposerStatus('Загрузка не удалась: ' + (e.message || e), 'bad');
  }finally{
    uploading = false;
    updateSendState();
  }
}

attachBtn.addEventListener('click', () => fileInput.click());
screenBtn.addEventListener('click', takeScreenshot);
voiceBtn.addEventListener('click', toggleVoice);
clearDraftBtn.addEventListener('click', clearDraft);
healthRetry.addEventListener('click', () => {
  status();
  poll();
});
fileInput.addEventListener('change', e => {
  uploadFiles(e.target.files);
  fileInput.value = '';
});
window.addEventListener('paste', e => {
  const data = e.clipboardData;
  const pastedFiles = data && data.files ? [...data.files].filter(Boolean) : [];
  const items = [...(data && data.items ? data.items : [])];
  const itemFiles = items
    .filter(i => i.kind === 'file')
    .map(i => i.getAsFile())
    .filter(Boolean);
  const files = pastedFiles.length ? pastedFiles : itemFiles;
  if(files.length){
    e.preventDefault();
    uploadFiles(files);
  }
});
window.addEventListener('dragenter', e => {
  e.preventDefault();
  dragDepth++;
  document.body.classList.add('dragover');
});
window.addEventListener('dragover', e => {
  e.preventDefault();
});
window.addEventListener('dragleave', e => {
  e.preventDefault();
  dragDepth = Math.max(0, dragDepth - 1);
  if(!dragDepth) document.body.classList.remove('dragover');
});
window.addEventListener('drop', e => {
  e.preventDefault();
  dragDepth = 0;
  document.body.classList.remove('dragover');
  const files = e.dataTransfer && e.dataTransfer.files ? e.dataTransfer.files : [];
  uploadFiles(files);
});
input.addEventListener('keydown', e => {
  if(e.key === 'Enter' && !e.shiftKey){
    e.preventDefault();
    send();
  }
});
input.addEventListener('input', () => {
  persistInput();
});
log.addEventListener('scroll', updateBottomButton);
toTop.addEventListener('click', () => log.scrollTo({top:0, behavior:'smooth'}));
toBottom.addEventListener('click', () => scrollToBottom('smooth'));
searchToggle.addEventListener('click', () => {
  if(searchPanel.classList.contains('open')) closeSearch();
  else openSearch();
});
exportChatBtn.addEventListener('click', exportChat);
exportMarkdownBtn.addEventListener('click', exportMarkdown);
compactToggle.addEventListener('click', () => {
  compactMode = !compactMode;
  localStorage.setItem('bridgeCompact', compactMode ? '1' : '0');
  applyViewPrefs();
});
systemToggle.addEventListener('click', () => {
  showSystem = !showSystem;
  localStorage.setItem('bridgeShowSystem', showSystem ? '1' : '0');
  applyViewPrefs();
});
filterButtons.forEach(btn => {
  btn.addEventListener('click', () => {
    activeFilter = btn.dataset.filter || 'all';
    localStorage.setItem('bridgeFilter', activeFilter);
    applyMessageFilter();
  });
});
searchClose.addEventListener('click', closeSearch);
searchPrev.addEventListener('click', () => stepSearch(-1));
searchNext.addEventListener('click', () => stepSearch(1));
searchInput.addEventListener('input', () => {
  searchIndex = 0;
  updateSearch(false);
});
searchInput.addEventListener('keydown', e => {
  if(e.key === 'Enter'){
    e.preventDefault();
    stepSearch(e.shiftKey ? -1 : 1);
  } else if(e.key === 'Escape'){
    e.preventDefault();
    closeSearch();
  }
});
document.addEventListener('click', e => {
  const systemBundleBtn = e.target.closest('.system-bundle button');
  if(systemBundleBtn){
    const groupId = systemBundleBtn.closest('.system-bundle')?.dataset.systemGroup;
    if(groupId){
      if(systemGroupsExpanded.has(groupId)) systemGroupsExpanded.delete(groupId);
      else systemGroupsExpanded.add(groupId);
      rebuildSystemGroups();
      updateDaySeparators();
      updateEmptyState();
    }
    return;
  }
  const wrapBtn = e.target.closest('.wrap-code');
  if(wrapBtn){
    const box = wrapBtn.closest('.codebox');
    if(box){
      const on = box.classList.toggle('wrap-code');
      wrapBtn.classList.toggle('on', on);
      wrapBtn.setAttribute('aria-pressed', on ? 'true' : 'false');
      wrapBtn.title = on ? 'Отключить перенос строк' : 'Переносить длинные строки';
      wrapBtn.setAttribute('aria-label', wrapBtn.title);
    }
    return;
  }
  const codeBtn = e.target.closest('.copy-code');
  if(codeBtn){
    const code = codeBtn.closest('.codebox')?.querySelector('code')?.textContent || '';
    copyText(code, codeBtn);
    return;
  }
  const favoriteBtn = e.target.closest('.favorite-msg');
  if(favoriteBtn){
    const msg = favoriteBtn.closest('.msg');
    setMessageFavorite(msg, !(msg && msg.dataset.favorite === '1'), favoriteBtn);
    return;
  }
  const quoteBtn = e.target.closest('.quote-msg');
  if(quoteBtn){
    quoteMessage(quoteBtn.closest('.msg'));
    return;
  }
  const msgBtn = e.target.closest('.copy-msg');
  if(msgBtn){
    const msg = msgBtn.closest('.msg');
    copyText(msg ? msg.dataset.copyText || msg.dataset.rawText || '' : '', msgBtn);
    return;
  }
  const attBtn = e.target.closest('.copy-att');
  if(attBtn){
    copyText(absoluteUrl(attBtn.dataset.url || ''), attBtn);
    return;
  }
  const linkBtn = e.target.closest('.link-msg');
  if(linkBtn){
    const msg = linkBtn.closest('.msg');
    const seq = msg ? msg.dataset.seq : '';
    if(seq){
      history.replaceState(null, '', '#m-' + encodeURIComponent(seq));
      flashTargetMessage(msg);
      copyText(messageLink(seq), linkBtn);
    }
    return;
  }
  const expandBtn = e.target.closest('.expand-msg');
  if(expandBtn){
    const msg = expandBtn.closest('.msg');
    const expanded = msg ? msg.classList.toggle('expanded') : false;
    expandBtn.textContent = expanded ? '↑' : '↓';
    expandBtn.title = expanded ? 'Свернуть длинное сообщение' : 'Развернуть длинное сообщение';
    expandBtn.setAttribute('aria-label', expandBtn.title);
    if(expanded) msg.scrollIntoView({behavior:'smooth', block:'nearest'});
    return;
  }
  const imgLink = e.target.closest('[data-lightbox]');
  if(imgLink){
    e.preventDefault();
    const href = imgLink.getAttribute('href');
    const img = lightbox.querySelector('img');
    img.src = href;
    img.alt = imgLink.dataset.name || '';
    lightboxName.textContent = [imgLink.dataset.name || 'изображение', imgLink.dataset.size || ''].filter(Boolean).join(' · ');
    lightboxOpen.href = href;
    lightbox.classList.add('open');
    lightbox.setAttribute('aria-hidden','false');
  }
});
lightbox.addEventListener('click', e => {
  if(e.target === lightbox || e.target.tagName === 'BUTTON'){
    lightbox.classList.remove('open');
    lightbox.setAttribute('aria-hidden','true');
    lightbox.querySelector('img').src = '';
    lightboxOpen.href = '#';
    lightboxName.textContent = '';
  }
});
window.addEventListener('keydown', e => {
  if((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'f'){
    e.preventDefault();
    openSearch();
    return;
  }
  if(e.key === 'Escape' && searchPanel.classList.contains('open')){
    closeSearch();
    return;
  }
  if(e.key === 'Escape' && lightbox.classList.contains('open')){
    lightbox.classList.remove('open');
    lightbox.setAttribute('aria-hidden','true');
    lightbox.querySelector('img').src = '';
  }
});
window.addEventListener('hashchange', () => focusHashTarget(true));

input.value = localStorage.getItem('bridgeDraft') || '';
applyViewPrefs();
applyMessageFilter();
resizeInput();
updateComposerMeta();
updateSendState();
poll();
status();
setInterval(poll, 1500);
setInterval(status, 1200);
setInterval(refreshTimes, 30000);
</script>
