<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Claude &lt;-&gt; Codex Bridge</title>
<style>
  :root{
    color-scheme: dark;
    --bg:#0f1115;
    --panel:#171a21;
    --panel-2:#1d222b;
    --panel-3:#10141a;
    --border:#303744;
    --border-soft:#252b35;
    --txt:#eef2f7;
    --muted:#9ca6b5;
    --soft:#c8d0dc;
    --claude:#b88cff;
    --claude-bg:#231a32;
    --codex:#68d391;
    --codex-bg:#16291f;
    --user:#72b7ff;
    --user-bg:#12263d;
    --system:#8c96a5;
    --system-bg:#14171d;
    --model:#ffd166;
    --danger:#ff6b6b;
    --shadow:0 18px 50px rgba(0,0,0,.32);
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;
    font-family:"Segoe UI",system-ui,-apple-system,BlinkMacSystemFont,sans-serif;
    background:
      radial-gradient(circle at 20% 0%, rgba(184,140,255,.08), transparent 24rem),
      radial-gradient(circle at 95% 10%, rgba(104,211,145,.07), transparent 22rem),
      var(--bg);
    color:var(--txt);
    display:flex;
    flex-direction:column;
    overflow:hidden;
  }
  button,textarea{font:inherit}
  button{
    background:var(--panel-2);
    color:var(--txt);
    border:1px solid var(--border);
    border-radius:8px;
    padding:7px 11px;
    cursor:pointer;
    font-size:13px;
    line-height:1;
    transition:background .16s,border-color .16s,transform .16s,color .16s;
  }
  button:hover{background:#252b36;border-color:#465061}
  button:active{transform:translateY(1px)}
  button.icon{width:38px;height:34px;display:grid;place-items:center;padding:0}
  button.primary{background:var(--user);border-color:var(--user);color:#06182d;font-weight:700}
  button.primary:hover{background:#8ac4ff;border-color:#8ac4ff}
  header{
    min-height:62px;
    padding:10px 16px;
    background:rgba(23,26,33,.92);
    border-bottom:1px solid var(--border);
    display:grid;
    grid-template-columns:auto minmax(220px,1fr) auto;
    gap:14px;
    align-items:center;
    backdrop-filter:blur(14px);
    box-shadow:0 1px 0 rgba(255,255,255,.03);
    z-index:3;
  }
  .brand{display:flex;align-items:center;gap:10px;min-width:0}
  .mark{
    width:34px;height:34px;border-radius:9px;
    display:grid;place-items:center;
    background:linear-gradient(135deg, rgba(184,140,255,.26), rgba(104,211,145,.22));
    border:1px solid rgba(255,255,255,.08);
    color:#fff;font-weight:800;
  }
  h1{font-size:15px;line-height:1.1;margin:0;font-weight:700;white-space:nowrap}
  .subtitle{font-size:12px;color:var(--muted);margin-top:3px;white-space:nowrap}
  .centerbar{display:flex;align-items:center;gap:12px;min-width:0}
  .chips{display:flex;gap:8px;flex-wrap:wrap;align-items:center;min-width:0}
  .chip{
    min-height:28px;
    padding:5px 10px;
    border-radius:999px;
    background:#202631;
    border:1px solid var(--border);
    color:var(--muted);
    font-size:12px;
    display:inline-flex;
    align-items:center;
    gap:7px;
    white-space:nowrap;
  }
  .chip .dot{width:8px;height:8px;border-radius:50%;background:#647082;transition:background .2s,box-shadow .2s}
  .chip.on{color:var(--txt);border-color:currentColor;background:#232936}
  .chip.claude.on{color:var(--claude)}
  .chip.claude.on .dot{background:var(--claude);box-shadow:0 0 12px var(--claude);animation:pulse 1.25s infinite}
  .chip.codex.on{color:var(--codex)}
  .chip.codex.on .dot{background:var(--codex);box-shadow:0 0 12px var(--codex);animation:pulse 1.25s infinite}
  .chip.model{display:none}
  .chip.model.on{display:inline-flex;color:var(--model);background:#2b2618;border-color:rgba(255,209,102,.7)}
  .chip.model.on .dot{background:var(--model);box-shadow:0 0 12px var(--model);animation:pulse 1.25s infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.42}}
  .meta{
    min-width:0;
    display:flex;
    flex-direction:column;
    gap:2px;
    color:var(--muted);
    font-size:12px;
  }
  .meta-line{display:flex;gap:6px;align-items:center;min-width:0}
  .meta b{color:var(--soft);font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .meta b.ok{color:var(--codex)}
  .meta b.warn{color:var(--model)}
  .meta b.bad{color:var(--danger)}
  .btns{display:flex;gap:8px;align-items:center;justify-content:flex-end}
  .btns button.on{border-color:var(--model);color:var(--model);background:#2b2618}
  #kill{background:#34191b;border-color:#7d3136;color:#ffd7da;font-weight:700}
  #kill:hover{background:#4a2024;border-color:var(--danger)}

  #searchPanel{
    display:none;
    align-items:center;
    gap:10px;
    padding:8px 16px;
    background:rgba(16,20,26,.96);
    border-bottom:1px solid var(--border);
    backdrop-filter:blur(14px);
    z-index:2;
  }
  #searchPanel.open{display:flex}
  .search-wrap{
    min-width:160px;
    flex:1;
    display:flex;
    align-items:center;
    gap:8px;
    padding:7px 10px;
    border:1px solid var(--border);
    border-radius:9px;
    background:#0b0f15;
  }
  .search-wrap span{color:var(--muted)}
  #searchInput{
    width:100%;
    min-width:0;
    border:0;
    outline:0;
    background:transparent;
    color:var(--txt);
    font:inherit;
    font-size:13px;
  }
  #searchInput::placeholder{color:#667184}
  #searchCount{
    min-width:86px;
    color:var(--muted);
    font-size:12px;
    text-align:center;
    white-space:nowrap;
  }
  .search-tools{display:flex;gap:7px;align-items:center}

  #log{
    position:relative;
    flex:1;
    overflow-y:auto;
    padding:22px 18px 24px;
    display:flex;
    flex-direction:column;
    gap:13px;
    scroll-behavior:smooth;
  }
  #log::-webkit-scrollbar{width:11px}
  #log::-webkit-scrollbar-track{background:transparent}
  #log::-webkit-scrollbar-thumb{background:#323946;border:3px solid var(--bg);border-radius:999px}
  .msg{
    width:fit-content;
    max-width:min(860px,84%);
    display:grid;
    grid-template-columns:34px minmax(0,1fr);
    gap:10px;
    align-items:start;
    animation:rise .18s ease-out;
  }
  @keyframes rise{from{opacity:.6;transform:translateY(3px)}to{opacity:1;transform:none}}
  .avatar{
    width:34px;height:34px;border-radius:10px;
    display:grid;place-items:center;
    border:1px solid var(--border-soft);
    background:var(--panel-2);
    color:var(--txt);
    font-weight:800;
    font-size:13px;
    box-shadow:0 8px 24px rgba(0,0,0,.18);
  }
  .bubble{
    min-width:0;
    position:relative;
    padding:10px 12px 9px;
    border:1px solid var(--border);
    border-radius:12px;
    background:var(--panel);
    box-shadow:0 10px 30px rgba(0,0,0,.16);
  }
  .msg-head{
    display:flex;
    align-items:center;
    gap:8px;
    min-width:0;
    margin-bottom:6px;
  }
  .who{
    font-size:12px;
    line-height:1.2;
    font-weight:750;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
  }
  .time{
    color:var(--muted);
    font-size:11px;
    line-height:1.2;
    white-space:nowrap;
  }
  .msg-actions{
    margin-left:auto;
    display:flex;
    opacity:0;
    pointer-events:none;
    transition:opacity .14s;
  }
  .msg:hover .msg-actions,.msg:focus-within .msg-actions{opacity:1;pointer-events:auto}
  .msg.search-hit .bubble{border-color:rgba(255,209,102,.58);box-shadow:0 0 0 1px rgba(255,209,102,.16),0 10px 30px rgba(0,0,0,.16)}
  .msg.search-current .bubble{border-color:var(--model);box-shadow:0 0 0 2px rgba(255,209,102,.28),0 16px 38px rgba(0,0,0,.24)}
  .mini-btn{
    height:24px;
    min-width:30px;
    padding:0 8px;
    border-radius:7px;
    background:#111720;
    border-color:#303846;
    color:var(--muted);
    font-size:11px;
  }
  .mini-btn:hover{color:var(--txt)}
  .from-claude .avatar,.from-claude .bubble{border-color:rgba(184,140,255,.28)}
  .from-claude .avatar{background:var(--claude-bg);color:var(--claude)}
  .from-claude .bubble{background:linear-gradient(180deg, rgba(35,26,50,.92), rgba(25,25,34,.96))}
  .from-claude .who{color:var(--claude)}
  .from-codex .avatar,.from-codex .bubble{border-color:rgba(104,211,145,.26)}
  .from-codex .avatar{background:var(--codex-bg);color:var(--codex)}
  .from-codex .bubble{background:linear-gradient(180deg, rgba(22,41,31,.92), rgba(24,29,34,.96))}
  .from-codex .who{color:var(--codex)}
  .from-user{
    align-self:flex-end;
    grid-template-columns:minmax(0,1fr) 34px;
    max-width:min(820px,84%);
  }
  .from-user .avatar{grid-column:2;grid-row:1;background:var(--user-bg);color:var(--user);border-color:rgba(114,183,255,.32)}
  .from-user .bubble{grid-column:1;grid-row:1;background:linear-gradient(180deg, rgba(18,38,61,.96), rgba(17,31,49,.98));border-color:rgba(114,183,255,.32)}
  .from-user .who{color:var(--user)}
  .from-system{
    align-self:center;
    max-width:min(900px,92%);
    grid-template-columns:minmax(0,1fr);
    gap:0;
  }
  .from-system .avatar{
    display:none;
  }
  .from-system .bubble{
    padding:6px 10px;
    border-style:dashed;
    border-color:rgba(140,150,165,.24);
    background:rgba(20,23,29,.56);
    box-shadow:none;
    color:#b0bac8;
  }
  .from-system .msg-head{margin-bottom:3px}
  .from-system .msg-actions{display:none}
  .from-system .who{color:var(--system)}
  .from-system .md{font-size:12px}
  body.hide-system .from-system:not(.search-hit){display:none}
  body.compact-mode #log{gap:8px;padding:14px 16px 18px}
  body.compact-mode .msg{
    grid-template-columns:26px minmax(0,1fr);
    gap:8px;
    max-width:min(940px,88%);
  }
  body.compact-mode .from-user{
    grid-template-columns:minmax(0,1fr) 26px;
    max-width:min(900px,88%);
  }
  body.compact-mode .avatar{width:26px;height:26px;border-radius:8px;font-size:11px}
  body.compact-mode .bubble{padding:7px 9px;border-radius:10px}
  body.compact-mode .msg-head{margin-bottom:3px}
  body.compact-mode .md{font-size:13px;line-height:1.45}
  body.compact-mode .from-system .bubble{padding:4px 8px}
  body.compact-mode .from-system .md{font-size:11.5px}
  .day-sep{
    align-self:center;
    width:min(760px,92%);
    display:flex;
    align-items:center;
    gap:10px;
    color:#788496;
    font-size:11px;
    font-weight:700;
    letter-spacing:.02em;
    text-transform:uppercase;
    margin:4px 0;
  }
  .day-sep:before,.day-sep:after{
    content:"";
    height:1px;
    flex:1;
    background:linear-gradient(90deg, transparent, rgba(120,132,150,.42), transparent);
  }

  .md{font-size:14px;line-height:1.56;color:var(--txt);overflow-wrap:anywhere}
  .md p{margin:.45em 0}
  .md p:first-child{margin-top:0}
  .md p:last-child{margin-bottom:0}
  .md h1,.md h2,.md h3,.md h4{margin:.65em 0 .35em;line-height:1.25;color:#fff}
  .md h1{font-size:1.28em}
  .md h2{font-size:1.18em}
  .md h3{font-size:1.08em}
  .md h4{font-size:1em}
  .md ul,.md ol{margin:.45em 0;padding-left:1.35em}
  .md li{margin:.22em 0}
  .md li.task{list-style:none;margin-left:-1.35em;display:flex;gap:8px;align-items:flex-start}
  .md li.task input{margin-top:.28em;accent-color:var(--codex)}
  .md blockquote{margin:.55em 0;padding:.1em .9em;border-left:3px solid var(--border);color:var(--soft)}
  .md .table-wrap{max-width:100%;overflow:auto;margin:.65em 0;border:1px solid var(--border);border-radius:10px;background:#0b0f15}
  .md table{width:100%;border-collapse:collapse;font-size:13px;min-width:420px}
  .md th,.md td{padding:8px 10px;border-bottom:1px solid var(--border-soft);vertical-align:top;text-align:left}
  .md th{background:#111720;color:#fff;font-weight:700;white-space:nowrap}
  .md tr:last-child td{border-bottom:0}
  .md tbody tr:hover{background:rgba(255,255,255,.025)}
  .md code{
    background:#0c1016;
    border:1px solid var(--border-soft);
    border-radius:5px;
    padding:1px 5px;
    font-family:Consolas,"Cascadia Mono","Courier New",monospace;
    font-size:.92em;
    color:#f4d78b;
  }
  .codebox{
    margin:.65em 0;
    border:1px solid var(--border);
    border-radius:10px;
    overflow:hidden;
    background:#0b0f15;
  }
  .codebar{
    min-height:31px;
    padding:5px 7px 5px 10px;
    display:flex;
    align-items:center;
    gap:8px;
    background:#111720;
    border-bottom:1px solid var(--border-soft);
    color:var(--muted);
    font-size:11px;
  }
  .codebar .lang{font-weight:700;text-transform:uppercase;letter-spacing:.03em}
  .copy-code{margin-left:auto}
  .md pre{
    margin:0;
    padding:12px;
    overflow:auto;
    background:#0b0f15;
    max-height:56vh;
  }
  .md pre code{
    display:block;
    min-width:100%;
    padding:0;
    border:0;
    background:transparent;
    color:#dfe7f3;
    font-size:13px;
    line-height:1.5;
    white-space:pre;
  }
  .md strong{color:#fff}
  .md a{color:#92c7ff;text-decoration:none;border-bottom:1px solid rgba(146,199,255,.34)}
  .md a:hover{border-bottom-color:#92c7ff}
  .attachments{display:flex;flex-direction:column;gap:8px;margin-top:9px}
  .att-img{
    display:block;
    max-width:min(560px,100%);
    color:var(--muted);
    text-decoration:none;
  }
  .att-img img{
    display:block;
    width:auto;
    max-width:100%;
    max-height:390px;
    border-radius:10px;
    border:1px solid var(--border);
    background:#0b0f15;
    box-shadow:0 12px 34px rgba(0,0,0,.22);
  }
  .att-name{
    display:block;
    margin-top:5px;
    font-size:12px;
    color:var(--muted);
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
  }
  .att-file{
    display:flex;
    align-items:center;
    gap:9px;
    width:max-content;
    max-width:100%;
    padding:8px 10px;
    border:1px solid var(--border);
    border-radius:9px;
    background:#0d1219;
    color:var(--txt);
    text-decoration:none;
  }
  .att-file:hover{border-color:#4b5565;background:#111822}
  .att-file .paper{color:var(--muted)}
  .att-file span.name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .att-file small{color:var(--muted);white-space:nowrap}

  #working{
    width:fit-content;
    max-width:min(760px,86%);
    display:none;
    align-items:center;
    gap:10px;
    margin-top:2px;
    padding:10px 12px;
    border-radius:12px;
    background:rgba(23,26,33,.9);
    border:1px solid var(--border);
    box-shadow:0 10px 28px rgba(0,0,0,.16);
  }
  #working.claude{border-color:rgba(184,140,255,.36)}
  #working.codex{border-color:rgba(104,211,145,.32)}
  #working .work-dot{
    width:28px;height:28px;border-radius:9px;
    display:grid;place-items:center;
    background:#202631;
    color:var(--muted);
    font-weight:800;
    font-size:12px;
  }
  #working.claude .work-dot{background:var(--claude-bg);color:var(--claude)}
  #working.codex .work-dot{background:var(--codex-bg);color:var(--codex)}
  #working .lbl{font-size:13px;font-weight:650;color:var(--soft)}
  .typing{display:inline-flex;gap:4px}
  .typing i{width:6px;height:6px;border-radius:50%;background:var(--muted);animation:bounce 1.2s infinite}
  .typing i:nth-child(2){animation-delay:.2s}
  .typing i:nth-child(3){animation-delay:.4s}
  @keyframes bounce{0%,60%,100%{transform:translateY(0);opacity:.38}30%{transform:translateY(-5px);opacity:1}}
  #toBottom{
    position:fixed;
    right:18px;
    bottom:86px;
    z-index:5;
    min-width:42px;
    height:42px;
    border-radius:999px;
    display:none;
    place-items:center;
    box-shadow:var(--shadow);
    background:#252c38;
  }
  #toBottom.show{display:grid}
  #toBottom .new-count{
    position:absolute;
    top:-7px;
    right:-7px;
    min-width:20px;
    height:20px;
    padding:0 5px;
    border-radius:999px;
    display:none;
    place-items:center;
    background:var(--user);
    color:#06182d;
    border:1px solid rgba(255,255,255,.22);
    font-size:11px;
    font-weight:800;
    line-height:1;
  }
  #toBottom.has-new .new-count{display:grid}
  footer{
    padding:12px 16px;
    background:rgba(23,26,33,.94);
    border-top:1px solid var(--border);
    display:flex;
    gap:10px;
    align-items:flex-end;
    backdrop-filter:blur(14px);
    z-index:4;
  }
  #inp{
    flex:1;
    min-height:44px;
    max-height:170px;
    background:#0b0f15;
    color:var(--txt);
    border:1px solid var(--border);
    border-radius:10px;
    padding:11px 12px;
    font-size:14px;
    line-height:1.45;
    resize:none;
    outline:none;
  }
  #inp:focus{border-color:rgba(114,183,255,.72);box-shadow:0 0 0 3px rgba(114,183,255,.12)}
  #attach{font-size:18px}
  #fileInput{display:none}
  body.dragover:after{
    content:"Отпустите файл, чтобы прикрепить";
    position:fixed;
    inset:12px;
    z-index:20;
    display:grid;
    place-items:center;
    border:2px dashed var(--user);
    border-radius:18px;
    background:rgba(7,10,15,.78);
    color:#d9ecff;
    font-weight:800;
    backdrop-filter:blur(5px);
  }
  #lightbox{
    position:fixed;
    inset:0;
    z-index:30;
    display:none;
    align-items:center;
    justify-content:center;
    padding:28px;
    background:rgba(0,0,0,.82);
  }
  #lightbox.open{display:flex}
  #lightbox img{max-width:96vw;max-height:90vh;border-radius:12px;border:1px solid var(--border);box-shadow:var(--shadow)}
  #lightbox button{position:absolute;top:18px;right:18px}

  @media (max-width:900px){
    header{grid-template-columns:1fr;gap:9px;align-items:start}
    .centerbar{flex-direction:column;align-items:stretch;gap:8px}
    .meta{gap:3px}
    .btns{justify-content:flex-start;flex-wrap:wrap}
  }
  @media (max-width:640px){
    body{background:var(--bg)}
    header{padding:10px 11px}
    .brand{gap:8px}
    .mark{width:31px;height:31px;border-radius:8px}
    h1{font-size:14px}
    .subtitle{display:none}
    .chips{gap:6px}
    .chip{padding:5px 8px;font-size:11px}
    .btns button:not(.icon){flex:1}
    #searchPanel{padding:8px 10px;flex-wrap:wrap}
    .search-wrap{flex-basis:100%}
    #searchCount{text-align:left;min-width:auto}
    .search-tools{margin-left:auto}
    #log{padding:14px 10px 18px;gap:11px}
    .msg,.from-user{max-width:100%;grid-template-columns:30px minmax(0,1fr);gap:8px}
    .from-user{grid-template-columns:minmax(0,1fr) 30px}
    .avatar{width:30px;height:30px;border-radius:9px}
    .bubble{padding:9px 10px;border-radius:11px}
    .msg-actions{opacity:1;pointer-events:auto}
    .md{font-size:13.5px}
    body.compact-mode #log{padding:10px 8px 14px}
    body.compact-mode .msg,body.compact-mode .from-user{max-width:100%}
    footer{padding:10px;gap:8px}
    #attach{width:38px}
    #send{padding:0 12px}
    #toBottom{right:12px;bottom:78px}
  }
  @media (prefers-reduced-motion:reduce){
    *,#log{scroll-behavior:auto!important;animation:none!important;transition:none!important}
  }
</style>
</head>
<body>
<header>
  <div class="brand">
    <div class="mark">CC</div>
    <div>
      <h1>Claude &lt;-&gt; Codex</h1>
      <div class="subtitle">локальный мост агентов</div>
    </div>
  </div>
  <div class="centerbar">
    <div class="chips" aria-label="Активные агенты">
      <span id="chipClaude" class="chip claude"><span class="dot"></span><span class="lbl">Claude</span></span>
      <span id="chipCodex" class="chip codex"><span class="dot"></span><span class="lbl">Codex</span></span>
      <span id="chipModel" class="chip model"><span class="dot"></span><span class="lbl">модель</span></span>
    </div>
    <div class="meta">
      <div class="meta-line"><span>сейчас:</span><b id="st">ожидание</b></div>
      <div class="meta-line"><span>задача:</span><b id="task">нет активной задачи</b></div>
      <div class="meta-line"><span>активность:</span><b id="beat">обновляется</b></div>
    </div>
  </div>
  <div class="btns">
    <button id="searchToggle" class="icon" type="button" title="Поиск по истории (Ctrl+F)">⌕</button>
    <button id="compactToggle" type="button" title="Переключить плотность ленты">Сжато</button>
    <button id="systemToggle" type="button" title="Показать или скрыть системные события">События</button>
    <button type="button" onclick="ctl('pause')" title="Пауза">⏸ Пауза</button>
    <button type="button" onclick="ctl('resume')" title="Продолжить">▶ Продолжить</button>
    <button id="kill" type="button" onclick="killSwitch()" title="Остановить текущую задачу">⛔ Стоп</button>
  </div>
</header>

<div id="searchPanel" aria-label="Поиск по истории">
  <label class="search-wrap">
    <span aria-hidden="true">⌕</span>
    <input id="searchInput" type="search" placeholder="Поиск по сообщениям, ролям и вложениям" autocomplete="off">
  </label>
  <span id="searchCount">поиск</span>
  <div class="search-tools">
    <button id="searchPrev" class="icon" type="button" title="Предыдущее совпадение">↑</button>
    <button id="searchNext" class="icon" type="button" title="Следующее совпадение">↓</button>
    <button id="searchClose" class="icon" type="button" title="Закрыть поиск">×</button>
  </div>

  <div id="working" class="">
    <span class="work-dot">...</span>
    <span class="lbl"></span>
    <span class="typing" aria-hidden="true"><i></i><i></i><i></i></span>
  </div>
</main>

<button id="toBottom" type="button" title="Прокрутить вниз"><span aria-hidden="true">↓</span><span id="newCount" class="new-count"></span></button>

  <button id="attach" class="icon" title="Прикрепить файл" type="button">📎</button>

  <button id="send" class="primary" type="button" onclick="send()">Отправить</button>
</footer>

<div id="lightbox" aria-hidden="true">
  <button type="button" class="icon" title="Закрыть">×</button>
  <img alt="">
</div>

<script>
let lastSeq = 0;
let firstLoad = true;
let stickToBottom = true;
let unseenCount = 0;
let searchMatches = [];
let searchIndex = -1;
let lastRenderedDay = '';

const log = document.getElementById('log');
const working = document.getElementById('working');
const toBottom = document.getElementById('toBottom');
const input = document.getElementById('inp');
const fileInput = document.getElementById('fileInput');
const lightbox = document.getElementById('lightbox');
const newCount = document.getElementById('newCount');
const searchToggle = document.getElementById('searchToggle');
const searchPanel = document.getElementById('searchPanel');
const searchInput = document.getElementById('searchInput');
const searchCount = document.getElementById('searchCount');
const searchPrev = document.getElementById('searchPrev');
const searchNext = document.getElementById('searchNext');
const searchClose = document.getElementById('searchClose');
const compactToggle = document.getElementById('compactToggle');
const systemToggle = document.getElementById('systemToggle');

const roleInfo = {
  claude:{name:'Claude · планировщик', short:'C'},
  codex:{name:'Codex · кодер', short:'X'},
  user:{name:'Вы', short:'U'},
  system:{name:'Система', short:'S'}
};
const modelNames = {
  sonnet:'Sonnet',
  opus:'Opus',
  haiku:'Haiku',
  codex:'Codex',
  'gpt-5':'GPT-5',
  'gpt-5.5':'GPT-5.5',
  'gpt-5.4':'GPT-5.4',
  'gpt-5.3-codex':'GPT-5.3 Codex'
};
let compactMode = localStorage.getItem('bridgeCompact') === '1';
let showSystem = localStorage.getItem('bridgeShowSystem') !== '0';

function esc(s){
  return String(s ?? '')
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;')
    .replace(/'/g,'&#39;');
}
function escAttr(s){ return esc(s).replace(/\n/g,'&#10;'); }
function modelLabel(raw){
  if(!raw) return '';
  const key = String(raw).toLowerCase();
  return modelNames[key] || String(raw);
}
function fullTime(ts){
  const d = new Date(ts);
  if(Number.isNaN(d.getTime())) return '';
  return d.toLocaleString('ru-RU', {dateStyle:'short', timeStyle:'medium'});
}
function dayKey(ts){
  const d = new Date(ts);
  if(Number.isNaN(d.getTime())) return '';
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}
function dayLabel(ts){
  const d = new Date(ts);
  if(Number.isNaN(d.getTime())) return '';
  const today = new Date();
  const yesterday = new Date();
  yesterday.setDate(today.getDate() - 1);
  if(dayKey(ts) === dayKey(today)) return 'Сегодня';
  if(dayKey(ts) === dayKey(yesterday)) return 'Вчера';
  return d.toLocaleDateString('ru-RU', {day:'numeric', month:'long', weekday:'long'});
}
function relativeTime(ts){
  const d = new Date(ts);
  if(Number.isNaN(d.getTime())) return '';
  const diff = Math.max(0, Date.now() - d.getTime());
  const sec = Math.floor(diff / 1000);
  if(sec < 45) return 'только что';
  const min = Math.floor(sec / 60);
  if(min < 60) return min + ' мин назад';
  const hr = Math.floor(min / 60);
  if(hr < 24) return hr + ' ч назад';
  const day = Math.floor(hr / 24);
  if(day < 7) return day + ' д назад';
  return d.toLocaleDateString('ru-RU');
}
function fmtSize(n){
  n = Number(n) || 0;
  if(n >= 1024 * 1024) return (n / (1024 * 1024)).toFixed(1) + ' MB';
  if(n >= 1024) return (n / 1024).toFixed(1) + ' KB';
  return n + ' B';
}
function isNearBottom(){
  return log.scrollHeight - log.scrollTop - log.clientHeight < 120;
}
function updateBottomButton(){
  stickToBottom = isNearBottom();
  if(stickToBottom) unseenCount = 0;
  toBottom.classList.toggle('show', !stickToBottom);
  toBottom.classList.toggle('has-new', unseenCount > 0);
  newCount.textContent = unseenCount > 99 ? '99+' : (unseenCount ? String(unseenCount) : '');
  toBottom.title = unseenCount ? unseenCount + ' новых сообщений ниже' : 'Прокрутить вниз';
}
function applyViewPrefs(){
  document.body.classList.toggle('compact-mode', compactMode);
  document.body.classList.toggle('hide-system', !showSystem);
  compactToggle.classList.toggle('on', compactMode);
  compactToggle.setAttribute('aria-pressed', compactMode ? 'true' : 'false');
  compactToggle.textContent = compactMode ? 'Комфортно' : 'Сжато';
  compactToggle.title = compactMode ? 'Вернуть комфортную ленту' : 'Сжать ленту';
  systemToggle.classList.toggle('on', !showSystem);
  systemToggle.setAttribute('aria-pressed', !showSystem ? 'true' : 'false');
  systemToggle.textContent = showSystem ? 'События' : 'Без событий';
  systemToggle.title = showSystem ? 'Скрыть системные события' : 'Показать системные события';
  if(stickToBottom) requestAnimationFrame(() => scrollToBottom('auto'));
  else requestAnimationFrame(updateBottomButton);
}
function scrollToBottom(behavior){
  unseenCount = 0;
  log.scrollTo({top:log.scrollHeight, behavior:behavior || 'smooth'});
  requestAnimationFrame(updateBottomButton);
}
function heartbeatInfo(ts){
  const d = new Date(ts);
  if(Number.isNaN(d.getTime())) return {label:'нет данных', level:'bad', title:''};
  const diff = Math.max(0, Date.now() - d.getTime());
  const sec = Math.floor(diff / 1000);
  if(sec < 45) return {label:'сейчас', level:'ok', title:fullTime(ts)};
  const min = Math.floor(sec / 60);
  if(min < 2) return {label:sec + ' сек назад', level:'warn', title:fullTime(ts)};
  if(min < 60) return {label:min + ' мин назад', level:min >= 5 ? 'bad' : 'warn', title:fullTime(ts)};
  const hr = Math.floor(min / 60);
  return {label:hr + ' ч назад', level:'bad', title:fullTime(ts)};
}
function elapsedShort(ts){
  const d = new Date(ts);
  if(Number.isNaN(d.getTime())) return '';
  const diff = Math.max(0, Date.now() - d.getTime());
  const sec = Math.floor(diff / 1000);
  if(sec < 60) return sec + ' сек';
  const min = Math.floor(sec / 60);
  if(min < 60) return min + ' мин';
  const hr = Math.floor(min / 60);
  if(hr < 24) return hr + ' ч';
  return Math.floor(hr / 24) + ' д';
}
function activityInfo(s){
  if(s.active_agent && s.claimed_at){
    const started = new Date(s.claimed_at);
    const ageMs = Number.isNaN(started.getTime()) ? 0 : Math.max(0, Date.now() - started.getTime());
    const who = s.active_agent === 'claude' ? 'Claude' : 'Codex';
    let level = 'ok';
    if(ageMs > 90 * 60 * 1000) level = 'bad';
    else if(ageMs > 30 * 60 * 1000) level = 'warn';
    return {
      label:who + ' ' + elapsedShort(s.claimed_at),
      level,
      title:'Ход начат: ' + fullTime(s.claimed_at) + (s.heartbeat ? ' · heartbeat: ' + fullTime(s.heartbeat) : '')
    };
  }
  return heartbeatInfo(s.heartbeat || s.driver_started);
}

function renderMd(src){
  src = String(src || '').replace(/\r\n/g,'\n');
  const blocks = [];
  src = src.replace(/```([^\n`]*)\n?([\s\S]*?)```/g, (m, lang, code) => {
    const cleanLang = String(lang || '').trim().split(/\s+/)[0] || 'text';
    const token = '@@CODE_BLOCK_' + blocks.length + '@@';
    blocks.push({token, lang:cleanLang, code:code.replace(/\n$/,'')});
    return '\n' + token + '\n';
  });

  let safe = esc(src);
  safe = safe.replace(/`([^`\n]+)`/g, '<code>$1</code>');
  safe = safe.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
  safe = safe.replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>');
  safe = safe.replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+|\/files\/[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');

  const lines = safe.split('\n');
  const out = [];
  let inList = false;
  let listType = '';
  const isTableSep = line => /^\|?\s*:?-{3,}:?\s*(\|\s*:?-{3,}:?\s*)+\|?$/.test(line.trim());
  const tableCells = line => {
    let s = line.trim();
    if(s.startsWith('|')) s = s.slice(1);
    if(s.endsWith('|')) s = s.slice(0, -1);
    return s.split('|').map(c => c.trim());
  };
  const renderListItem = body => {
    const task = body.match(/^\[(x|X| )\]\s+(.*)$/);
    if(task){
      const checked = task[1].toLowerCase() === 'x' ? ' checked' : '';
      return '<li class="task"><input type="checkbox" disabled' + checked + '><span>' + task[2] + '</span></li>';
    }
    return '<li>' + body + '</li>';
  };
  const renderTable = (headers, rows) => {
    const head = '<thead><tr>' + headers.map(h => '<th>' + h + '</th>').join('') + '</tr></thead>';
    const body = '<tbody>' + rows.map(row => {
      const cells = headers.map((_, i) => '<td>' + (row[i] || '') + '</td>').join('');
      return '<tr>' + cells + '</tr>';
    }).join('') + '</tbody>';
    return '<div class="table-wrap"><table>' + head + body + '</table></div>';
  };
  const closeList = () => {
    if(inList){
      out.push('</' + listType + '>');
      inList = false;
      listType = '';
    }
  };

  for(let i = 0; i < lines.length; i++){
    const line = lines[i];
    const trimmed = line.trim();
    if(/^@@CODE_BLOCK_\d+@@$/.test(trimmed)){
      closeList();
      out.push(trimmed);
      continue;
    }
    const h = line.match(/^(#{1,4})\s+(.*)$/);
    const ul = line.match(/^\s*[-*]\s+(.*)$/);
    const ol = line.match(/^\s*\d+\.\s+(.*)$/);
    const quote = line.match(/^\s*&gt;\s?(.*)$/);
    if(trimmed.includes('|') && i + 1 < lines.length && isTableSep(lines[i + 1])){
      closeList();
      const headers = tableCells(line);
      const rows = [];
      i += 2;
      while(i < lines.length && lines[i].trim() && lines[i].includes('|') && !/^@@CODE_BLOCK_\d+@@$/.test(lines[i].trim())){
        rows.push(tableCells(lines[i]));
        i++;
      }
      i--;
      out.push(renderTable(headers, rows));
    } else if(h){
      closeList();
      out.push('<h' + h[1].length + '>' + h[2] + '</h' + h[1].length + '>');
    } else if(ul){
      if(!inList || listType !== 'ul'){ closeList(); inList = true; listType = 'ul'; out.push('<ul>'); }
      out.push(renderListItem(ul[1]));
    } else if(ol){
      if(!inList || listType !== 'ol'){ closeList(); inList = true; listType = 'ol'; out.push('<ol>'); }
      out.push(renderListItem(ol[1]));
    } else if(quote){
      closeList();
      out.push('<blockquote>' + quote[1] + '</blockquote>');
    } else {
      closeList();
      if(trimmed) out.push('<p>' + line + '</p>');
    }
  }
  closeList();

  let html = out.join('\n');
  for(const block of blocks){
    const codeHtml =
      '<div class="codebox">' +
        '<div class="codebar"><span class="lang">' + esc(block.lang) + '</span><button type="button" class="mini-btn copy-code">copy</button></div>' +
        '<pre><code>' + esc(block.code) + '</code></pre>' +
      '</div>';
    html = html.replace(block.token, codeHtml);
  }
  return html;
}

function msgAttachments(m){
  return Array.isArray(m.attachments) ? m.attachments : (m.attachments ? [m.attachments] : []);
}
function renderAttachments(m){
  const atts = msgAttachments(m);
  if(!atts.length) return '';
  return '<div class="attachments">' + atts.map(a => {
    const url = escAttr(a.url || '#');
    const name = esc(a.name || 'file');
    const mime = String(a.mime || '');
    if(a.kind === 'image' || mime.startsWith('image/')){
      return '<a class="att-img" href="' + url + '" target="_blank" rel="noopener" data-lightbox="' + url + '">' +
        '<img src="' + url + '" alt="' + name + '" loading="lazy">' +
        '<span class="att-name">' + name + '</span>' +
      '</a>';
    }
    return '<a class="att-file" href="' + url + '" download>' +
      '<span class="paper">📎</span><span class="name">' + name + '</span><small>' + fmtSize(a.size) + '</small>' +
    '</a>';
  }).join('') + '</div>';
}
function normalizeSearch(s){
  return String(s || '').toLocaleLowerCase('ru-RU');
}
function clearSearchMarks(){
  document.querySelectorAll('.msg.search-hit,.msg.search-current').forEach(n => {
    n.classList.remove('search-hit','search-current');
  });
}
function updateSearchCount(){
  if(!searchInput.value.trim()){
    searchCount.textContent = 'поиск';
  } else if(!searchMatches.length){
    searchCount.textContent = 'нет совпадений';
  } else {
    searchCount.textContent = (searchIndex + 1) + ' / ' + searchMatches.length;
  }
}
function setCurrentSearch(scrollCurrent){
  document.querySelectorAll('.msg.search-current').forEach(n => n.classList.remove('search-current'));
  if(searchIndex >= 0 && searchMatches[searchIndex]){
    const current = searchMatches[searchIndex];
    current.classList.add('search-current');
    if(scrollCurrent !== false) current.scrollIntoView({behavior:'smooth', block:'center'});
  }
  updateSearchCount();
}
function updateSearch(scrollCurrent){
  const q = normalizeSearch(searchInput.value.trim());
  searchMatches = [];
  clearSearchMarks();
  if(!q){
    searchIndex = -1;
    updateSearchCount();
    return;
  }
  document.querySelectorAll('.msg').forEach(msg => {
    if(normalizeSearch(msg.dataset.searchText).includes(q)){
      msg.classList.add('search-hit');
      searchMatches.push(msg);
    }
  });
  if(searchMatches.length){
    if(searchIndex < 0 || searchIndex >= searchMatches.length) searchIndex = 0;
    setCurrentSearch(scrollCurrent);
  } else {
    searchIndex = -1;
    updateSearchCount();
  }
}
function stepSearch(delta){
  if(!searchMatches.length) return;
  searchIndex = (searchIndex + delta + searchMatches.length) % searchMatches.length;
  setCurrentSearch(true);
}
function openSearch(){
  searchPanel.classList.add('open');
  searchToggle.classList.add('on');
  searchToggle.setAttribute('aria-pressed','true');
  updateSearch(false);
  setTimeout(() => {
    searchInput.focus();
    searchInput.select();
  }, 0);
}
function closeSearch(){
  searchPanel.classList.remove('open');
  searchToggle.classList.remove('on');
  searchToggle.setAttribute('aria-pressed','false');
  clearSearchMarks();
}
function addMsg(m){
  const key = dayKey(m.ts);
  if(key && key !== lastRenderedDay){
    const sep = document.createElement('div');
    sep.className = 'day-sep';
    sep.textContent = dayLabel(m.ts);
    log.insertBefore(sep, working);
    lastRenderedDay = key;
  }
  const role = roleInfo[m.from] || {name:m.from || 'unknown', short:'?'};
  const atts = msgAttachments(m);
  const div = document.createElement('article');
  div.className = 'msg from-' + esc(String(m.from || 'system')).replace(/[^a-z0-9_-]/gi,'');
  div.dataset.rawText = m.text || '';
  div.dataset.searchText = [role.name, m.from || '', m.text || '', ...atts.map(a => a.name || '')].join(' ');
  div.innerHTML =
    '<div class="avatar" aria-hidden="true">' + esc(role.short) + '</div>' +
    '<div class="bubble">' +
      '<div class="msg-head">' +
        '<div class="who">' + esc(role.name) + '</div>' +
        '<time class="time" datetime="' + escAttr(m.ts || '') + '" title="' + escAttr(fullTime(m.ts)) + '">' + esc(relativeTime(m.ts)) + '</time>' +
        '<div class="msg-actions"><button type="button" class="mini-btn copy-msg" title="Копировать сообщение">copy</button></div>' +
      '</div>' +
      '<div class="md">' + renderMd(m.text) + '</div>' +
      renderAttachments(m) +
    '</div>';
  log.insertBefore(div, working);
}
function refreshTimes(){
  document.querySelectorAll('time.time').forEach(t => {
    t.textContent = relativeTime(t.getAttribute('datetime'));
    t.title = fullTime(t.getAttribute('datetime'));
  });
}

async function poll(){
  try{
    const beforeBottom = isNearBottom();
    const r = await fetch('/api/messages?since=' + lastSeq);
    const data = await r.json();
    for(const m of data){
      addMsg(m);
      lastSeq = Math.max(lastSeq, Number(m.seq) || 0);
    }
    if(data.length){
      if(searchPanel.classList.contains('open') && searchInput.value.trim()) updateSearch(false);
      if(beforeBottom || firstLoad){
        scrollToBottom(firstLoad ? 'auto' : 'smooth');
        firstLoad = false;
      } else {
        unseenCount += data.length;
      }
    }
    updateBottomButton();
  }catch(e){}
}
function setChip(id,on){
  const c = document.getElementById(id);
  c.classList.toggle('on', Boolean(on));
}
function fallbackStatus(s, mdl){
  const act = s.active_agent;
  const mode = s.task_mode || s.mode || '';
  if(act === 'claude' && mode === 'discuss') return 'Claude сводит обсуждение и уточняет следующий шаг.';
  if(act === 'claude') return 'Claude анализирует задачу и выбирает следующий шаг.';
  if(act === 'codex' && mode === 'discuss') return 'Codex оценивает план, риски и варианты без изменения файлов.';
  if(act === 'codex') return 'Codex выполняет правку и проверяет результат.';
  if(s.paused) return 'Пауза: мост ждёт команды продолжить.';
  if(s.status === 'idle') return 'Ожидание новой задачи.';
  return s.status || 'Ожидание';
}
async function status(){
  try{
    const r = await fetch('/api/status');
    const s = await r.json();
    if(typeof s.lastSeq === 'number' && s.lastSeq < lastSeq){
      [...log.querySelectorAll('.msg,.day-sep')].forEach(n => n.remove());
      lastSeq = 0;
      lastRenderedDay = '';
      firstLoad = true;
    }

    const act = s.active_agent;
    const mdl = modelLabel(s.active_model);
    const readableStatus = s.status || 'idle';
    const statusText = (act === 'claude' || act === 'codex' || s.paused)
      ? (s.status_text || fallbackStatus(s, mdl))
      : readableStatus;
    const statusEl = document.getElementById('st');
    statusEl.textContent = statusText;
    statusEl.title = statusText === readableStatus ? '' : readableStatus;

    const beatEl = document.getElementById('beat');
    const beat = activityInfo(s);
    beatEl.textContent = beat.label;
    beatEl.className = beat.level;
    beatEl.title = beat.title;

    const taskEl = document.getElementById('task');
    const taskText = s.current_task ? String(s.current_task) : 'нет активной задачи';
    taskEl.textContent = taskText.length > 62 ? taskText.slice(0, 62) + '...' : taskText;
    taskEl.title = taskText;

    setChip('chipClaude', act === 'claude');
    setChip('chipCodex', act === 'codex');
    setChip('chipModel', Boolean(act && mdl));
    document.querySelector('#chipClaude .lbl').textContent = 'Claude';
    document.querySelector('#chipCodex .lbl').textContent = 'Codex';
    document.querySelector('#chipModel .lbl').textContent = mdl ? 'модель: ' + mdl : 'модель';

    if(act === 'claude' || act === 'codex'){
      const text = statusText;
      working.className = act;
      working.querySelector('.work-dot').textContent = act === 'claude' ? 'C' : 'X';
      working.querySelector('.lbl').textContent = mdl ? text + ' (' + mdl + ')' : text;
      working.style.display = 'flex';
      if(isNearBottom()) scrollToBottom('smooth');
    } else {
      working.style.display = 'none';
    }
    updateBottomButton();
  }catch(e){}
}
function resizeInput(){
  input.style.height = 'auto';
  input.style.height = Math.min(input.scrollHeight, 170) + 'px';
}
async function copyText(text, btn){
  try{
    if(navigator.clipboard && window.isSecureContext){
      await navigator.clipboard.writeText(text);
    } else {
      const t = document.createElement('textarea');
      t.value = text;
      t.style.position = 'fixed';
      t.style.left = '-9999px';
      document.body.appendChild(t);
      t.focus();
      t.select();
      document.execCommand('copy');
      t.remove();
    }
    if(btn){
      const old = btn.textContent;
      btn.textContent = 'ok';
      setTimeout(() => { btn.textContent = old; }, 900);
    }
  }catch(e){
    if(btn) btn.textContent = 'err';
  }
}
async function send(){
  const text = input.value.trim();
  if(!text) return;
  input.value = '';
  localStorage.removeItem('bridgeDraft');
  resizeInput();
  await fetch('/api/say', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({text})});
  poll();
}
async function ctl(action){
  await fetch('/api/control', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({action})});
  status();
}
async function killSwitch(){
  if(!confirm('Стоп-кран: прервать текущую задачу и остановить процесс агента?')) return;
  await ctl('kill');
}
function readDataUrl(file){
  return new Promise((resolve,reject) => {
    const fr = new FileReader();
    fr.onload = () => resolve(fr.result);
    fr.onerror = () => reject(fr.error);
    fr.readAsDataURL(file);
  });
}
async function uploadFiles(files){
  files = [...files].filter(Boolean);
  if(!files.length) return;
  const caption = input.value.trim();
  if(caption){
    input.value = '';
    localStorage.removeItem('bridgeDraft');
    resizeInput();
  }
  for(let i = 0; i < files.length; i++){
    const file = files[i];
    const dataB64 = await readDataUrl(file);
    const text = i === 0 ? caption : '';
    const r = await fetch('/api/upload', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({name:file.name || 'clipboard.png', mime:file.type || '', dataB64, text})
    });
    if(!r.ok){
      alert('Upload failed: ' + r.status);
      break;
    }
  }
  poll();
}

document.getElementById('attach').addEventListener('click', () => fileInput.click());
fileInput.addEventListener('change', e => {
  uploadFiles(e.target.files);
  fileInput.value = '';
});
window.addEventListener('paste', e => {
  const items = [...(e.clipboardData && e.clipboardData.items ? e.clipboardData.items : [])];
  const files = items.filter(i => i.kind === 'file' && i.type.startsWith('image/')).map(i => i.getAsFile()).filter(Boolean);
  if(files.length){
    e.preventDefault();
    uploadFiles(files);
  }
});
for(const ev of ['dragenter','dragover']){
  window.addEventListener(ev, e => {
    e.preventDefault();
    document.body.classList.add('dragover');
  });
}
for(const ev of ['dragleave','drop']){
  window.addEventListener(ev, e => {
    e.preventDefault();
    document.body.classList.remove('dragover');
  });
}
window.addEventListener('drop', e => {
  const files = e.dataTransfer && e.dataTransfer.files ? e.dataTransfer.files : [];
  uploadFiles(files);
});
input.addEventListener('keydown', e => {
  if(e.key === 'Enter' && !e.shiftKey){
    e.preventDefault();
    send();
  }
});
input.addEventListener('input', () => {
  localStorage.setItem('bridgeDraft', input.value);
  resizeInput();
});
log.addEventListener('scroll', updateBottomButton);
toBottom.addEventListener('click', () => scrollToBottom('smooth'));
searchToggle.addEventListener('click', () => {
  if(searchPanel.classList.contains('open')) closeSearch();
  else openSearch();
});
compactToggle.addEventListener('click', () => {
  compactMode = !compactMode;
  localStorage.setItem('bridgeCompact', compactMode ? '1' : '0');
  applyViewPrefs();
});
systemToggle.addEventListener('click', () => {
  showSystem = !showSystem;
  localStorage.setItem('bridgeShowSystem', showSystem ? '1' : '0');
  applyViewPrefs();
});
searchClose.addEventListener('click', closeSearch);
searchPrev.addEventListener('click', () => stepSearch(-1));
searchNext.addEventListener('click', () => stepSearch(1));
searchInput.addEventListener('input', () => {
  searchIndex = 0;
  updateSearch(false);
});
searchInput.addEventListener('keydown', e => {
  if(e.key === 'Enter'){
    e.preventDefault();
    stepSearch(e.shiftKey ? -1 : 1);
  } else if(e.key === 'Escape'){
    e.preventDefault();
    closeSearch();
  }
});
document.addEventListener('click', e => {
  const codeBtn = e.target.closest('.copy-code');
  if(codeBtn){
    const code = codeBtn.closest('.codebox')?.querySelector('code')?.textContent || '';
    copyText(code, codeBtn);
    return;
  }
  const msgBtn = e.target.closest('.copy-msg');
  if(msgBtn){
    const msg = msgBtn.closest('.msg');
    copyText(msg ? msg.dataset.rawText || '' : '', msgBtn);
    return;
  }
  const imgLink = e.target.closest('[data-lightbox]');
  if(imgLink){
    e.preventDefault();
    lightbox.querySelector('img').src = imgLink.getAttribute('href');
    lightbox.classList.add('open');
    lightbox.setAttribute('aria-hidden','false');
  }
});
lightbox.addEventListener('click', e => {
  if(e.target === lightbox || e.target.tagName === 'BUTTON'){
    lightbox.classList.remove('open');
    lightbox.setAttribute('aria-hidden','true');
    lightbox.querySelector('img').src = '';
  }
});
window.addEventListener('keydown', e => {
  if((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'f'){
    e.preventDefault();
    openSearch();
    return;
  }
  if(e.key === 'Escape' && searchPanel.classList.contains('open')){
    closeSearch();
    return;
  }
  if(e.key === 'Escape' && lightbox.classList.contains('open')){
    lightbox.classList.remove('open');
    lightbox.setAttribute('aria-hidden','true');
    lightbox.querySelector('img').src = '';
  }
});

input.value = localStorage.getItem('bridgeDraft') || '';
applyViewPrefs();
resizeInput();
poll();
status();
setInterval(poll, 1500);
setInterval(status, 1200);
setInterval(refreshTimes, 30000);
</script>
</body>
</html>
